<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas API 文档 — 数据接口平台</title>
<meta name="description" content="Atlas API 开发者文档：快速开始、认证、分页与错误处理。支持全文搜索、版本切换与可运行示例。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B2733'/%3E%3Cpath d='M8 22L16 9l8 13' stroke='%2338BDF8' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M12 18h8' stroke='%2338BDF8' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  @font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url("../../fonts/inter-latin-variable.woff2") format("woff2")}
  @font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url("../../fonts/instrument-sans-latin-variable.woff2") format("woff2")}
  :root{
    --bg:#FFFFFF; --bg-2:#F7F8FA; --line:#E5E8EC; --line-2:#D3D8DF;
    --ink:#1A2430; --ink-2:#46525F; --ink-3:#7A8593;
    --acc:#0C87C9; --acc-deep:#0A6FA6; --acc-bg:#E7F4FB;
    --code-bg:#152230; --code-ink:#DCE7F2;
    --warn:#9A5B00; --warn-bg:#FCF2DF;
    --ok:#0E9F6E; --bad:#C0392B;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Consolas,"Cascadia Code",monospace;
    --sans:"Inter",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --disp:"Instrument Sans","Inter",system-ui,-apple-system,"PingFang SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
  a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline;text-underline-offset:3px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  ::selection{background:rgba(12,135,201,.2)}

  .shell{display:grid;grid-template-columns:262px minmax(0,1fr) 208px;max-width:1400px;margin:0 auto}
  @media (max-width:1180px){.shell{grid-template-columns:250px minmax(0,1fr)}.toc{display:none}}
  @media (max-width:860px){.shell{grid-template-columns:1fr}.sidebar{display:none}}

  /* header */
  .hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 22px;height:60px}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:16.5px;letter-spacing:-.01em;color:var(--ink)}
  .logo:hover{text-decoration:none}
  .logo i{width:25px;height:25px;border-radius:7px;background:linear-gradient(135deg,#1B2733,#2E4358);display:grid;place-items:center}
  .logo svg{width:14px;height:14px}
  .logo small{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:5px;padding:2px 6px}
  .ver{position:relative}
  .ver>button{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;border:1px solid var(--line-2);border-radius:8px;padding:6px 11px;color:var(--ink-2)}
  .ver>button:hover{border-color:var(--ink-3)}
  .ver .menu{position:absolute;top:calc(100% + 6px);left:0;width:230px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px -12px rgba(26,36,48,.25);padding:6px;display:none;z-index:60}
  .ver .menu.open{display:block;animation:fade .18s}
  .ver .menu button{width:100%;text-align:left;border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:1px}
  .ver .menu button:hover{background:var(--bg-2)}
  .ver .menu b{font-size:13px;display:flex;align-items:center;gap:8px}
  .ver .menu b .tag{font-size:9.5px;font-weight:800;letter-spacing:.06em;border-radius:5px;padding:2px 6px}
  .tag-cur{background:var(--acc-bg);color:var(--acc-deep)}
  .tag-old{background:var(--warn-bg);color:var(--warn)}
  .ver .menu span{font-size:11.5px;color:var(--ink-3)}
  .searchbtn{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;color:var(--ink-3);font-size:13px;min-width:230px;transition:border-color .15s}
  .searchbtn:hover{border-color:var(--acc)}
  .searchbtn svg{width:14px;height:14px;flex:none}
  .searchbtn .kbd{margin-left:auto;display:flex;gap:3px}
  kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink-3);background:var(--bg-2)}
  .gh{font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
  .gh:hover{color:var(--ink)}
  @media (max-width:860px){.searchbtn{min-width:0}.searchbtn span.s-txt{display:none}}

  /* v1 banner */
  .banner{grid-column:1/-1;background:var(--warn-bg);color:var(--warn);font-size:13px;padding:9px 22px;text-align:center;display:none}
  .banner.show{display:block}
  .banner b{font-weight:700}

  /* sidebar */
  .sidebar{border-right:1px solid var(--line);padding:26px 18px 40px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
  .sg{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;margin:22px 0 8px}
  .sg:first-child{margin-top:0}
  .si{display:block;width:100%;text-align:left;font-size:13.5px;color:var(--ink-2);padding:6px 12px;border-radius:8px;margin:1px 0;transition:background .12s,color .12s}
  .si:hover{background:var(--bg-2);color:var(--ink);text-decoration:none}
  .si.on{background:var(--acc-bg);color:var(--acc-deep);font-weight:600}
  .si .dep{font-size:9.5px;font-weight:800;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:1.5px 6px;margin-left:7px;vertical-align:1px}

  /* article */
  .art{padding:38px clamp(24px,4vw,54px) 80px;min-width:0}
  .breadcrumb{font-size:12.5px;color:var(--ink-3);margin-bottom:14px}
  h1{font-family:var(--disp);font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.2;margin-bottom:10px}
  .lead{color:var(--ink-2);font-size:16px;margin-bottom:30px;max-width:64ch}
  .art h2{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:-.015em;margin:44px 0 14px;scroll-margin-top:80px}
  .art h3{font-size:16.5px;font-weight:700;margin:30px 0 10px;scroll-margin-top:80px}
  .art p{color:var(--ink-2);margin-bottom:14px;max-width:70ch}
  .art ul,.art ol{color:var(--ink-2);padding-left:24px;margin-bottom:16px}
  .art li{margin-bottom:6px}
  .art code:not(pre code){font-family:var(--mono);font-size:.86em;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:1.5px 6px;color:var(--acc-deep)}
  .callout{display:flex;gap:12px;border:1px solid;border-radius:12px;padding:14px 17px;margin:20px 0;font-size:14px}
  .callout b{display:block;margin-bottom:2px}
  .callout.info{background:var(--acc-bg);border-color:color-mix(in srgb,var(--acc) 30%,transparent);color:var(--ink-2)}
  .callout.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink-2)}
  .callout .co-ic{flex:none;font-size:15px}
  table.params{width:100%;border-collapse:collapse;font-size:13.5px;margin:16px 0 22px}
  table.params th{text-align:left;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 12px;border-bottom:2px solid var(--line)}
  table.params td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top}
  table.params td:first-child{font-family:var(--mono);font-size:12.5px;color:var(--ink);white-space:nowrap}
  .req{font-size:9.5px;font-weight:800;letter-spacing:.05em;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:1px}
  .req.y{background:#FDEBE9;color:var(--bad)} .req.n{background:var(--bg-2);color:var(--ink-3)}

  /* code block */
  .code{border-radius:13px;overflow:hidden;margin:18px 0 24px;border:1px solid #0E1B28;background:var(--code-bg)}
  .code-h{display:flex;align-items:center;padding:0 8px 0 16px;height:44px;background:#1B2C3D;border-bottom:1px solid rgba(255,255,255,.07)}
  .code-h .fn{font-family:var(--mono);font-size:12px;color:#8FA5BC;display:flex;gap:8px;align-items:center}
  .code-h .fn .dots{display:inline-flex;gap:5px}
  .code-h .fn .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14)}
  .ctabs{display:flex;gap:2px;margin-left:14px}
  .ctabs button{font-family:var(--mono);font-size:11.5px;color:#7E93A9;padding:6px 12px;border-radius:7px}
  .ctabs button.on{background:rgba(255,255,255,.1);color:#fff}
  .code-actions{margin-left:auto;display:flex;gap:6px}
  .cbtn{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#AFC3D6;border-radius:7px;padding:6px 11px;transition:background .15s}
  .cbtn:hover{background:rgba(255,255,255,.1);color:#fff}
  .cbtn.run{color:#5EEAD4}
  .cbtn.run:hover{background:rgba(94,234,212,.12)}
  pre{padding:17px 19px;overflow-x:auto;font-family:var(--mono);font-size:12.8px;line-height:1.75;color:var(--code-ink);tab-size:2}
  .tok-k{color:#7DD3FC} .tok-s{color:#BEF264} .tok-n{color:#FBBF24} .tok-c{color:#5B7186;font-style:italic} .tok-f{color:#C4B5FD}
  .cout{border-top:1px solid rgba(255,255,255,.08);background:#0D1822;padding:14px 19px;display:none}
  .cout.show{display:block;animation:fade .25s}
  .cout .cl{font-size:11px;font-weight:800;letter-spacing:.1em;color:#5B7186;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .cout pre{padding:0;font-size:12.3px}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* pager */
  .pager{display:flex;justify-content:space-between;gap:14px;margin-top:56px;border-top:1px solid var(--line);padding-top:22px}
  .pager a{border:1px solid var(--line);border-radius:12px;padding:13px 18px;flex:1;max-width:290px;transition:border-color .15s,transform .15s}
  .pager a:hover{text-decoration:none;border-color:var(--acc);transform:translateY(-2px)}
  .pager .dir{font-size:11px;color:var(--ink-3);display:block;margin-bottom:3px}
  .pager b{font-size:14px;color:var(--ink)}
  .pager .next{text-align:right;margin-left:auto}
  .editlink{display:block;margin-top:26px;font-size:12.5px;color:var(--ink-3)}

  /* toc */
  .toc{border-left:1px solid var(--line);padding:38px 20px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
  .toc .t{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;margin-bottom:12px}
  .toc a{display:block;font-size:12.8px;color:var(--ink-3);padding:4px 0 4px 12px;border-left:2px solid var(--line)}
  .toc a:hover{color:var(--ink);text-decoration:none}
  .toc a.on{color:var(--acc-deep);border-left-color:var(--acc);font-weight:600}
  .footline{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}

  /* search modal */
  .sm-ov{position:fixed;inset:0;z-index:90;background:rgba(20,30,40,.45);backdrop-filter:blur(5px);display:none;padding:12vh 20px 20px}
  .sm-ov.open{display:block;animation:fade .18s}
  .sm{width:min(600px,100%);margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 30px 80px -20px rgba(10,20,30,.45);overflow:hidden;animation:pop .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .sm-in{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .sm-in svg{width:17px;height:17px;color:var(--ink-3);flex:none}
  .sm-in input{flex:1;border:0;outline:none;font:inherit;font-size:15.5px}
  .sm-in .esc{font-size:10.5px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:2px 7px}
  .sm-res{max-height:52vh;overflow-y:auto;padding:8px}
  .sm-g{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;padding:10px 12px 5px}
  .sm-i{width:100%;text-align:left;display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:10px}
  .sm-i .ic{width:30px;height:30px;border-radius:8px;background:var(--bg-2);display:grid;place-items:center;font-size:13px;flex:none;color:var(--acc-deep)}
  .sm-i b{font-size:13.8px;display:block}
  .sm-i small{font-size:12px;color:var(--ink-3);display:block;line-height:1.5}
  .sm-i small mark{background:rgba(12,135,201,.16);color:var(--acc-deep);border-radius:3px;padding:0 2px}
  .sm-i.sel{background:var(--acc-bg)}
  .sm-i .enter{margin-left:auto;align-self:center;opacity:0;flex:none}
  .sm-i.sel .enter{opacity:1}
  .sm-empty{padding:44px;text-align:center;color:var(--ink-3);font-size:13.5px}
  .sm-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:11px}
  .sm-foot span{display:inline-flex;gap:5px;align-items:center}
</style>
</head>
<body>

<div class="shell">
  <header class="hdr">
    <a class="logo" href="#" onclick="go('intro');return false"><i><svg viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19 12 6l6 13"/><path d="M9 14h6"/></svg></i>Atlas<small>DOCS</small></a>
    <div class="ver">
      <button id="verBtn">v2.4 <svg width="9" height="9" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>
      <div class="menu" id="verMenu">
        <button data-v="v24"><b>v2.4 <span class="tag tag-cur">最新稳定版</span></b><span>推荐所有新项目使用</span></button>
        <button data-v="v19"><b>v1.9 <span class="tag tag-old">维护模式</span></b><span>仅安全修复，2026-12 停止支持</span></button>
      </div>
    </div>
    <button class="searchbtn" id="searchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="s-txt">搜索文档…</span><span class="kbd"><kbd>⌘</kbd><kbd>K</kbd></span></button>
    <a class="gh" href="#" onclick="return false"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.1.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.56 9.56 0 0 1 5 0c1.91-1.3 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85V21c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>GitHub</a>
  </header>
  <div class="banner" id="vBanner">您正在浏览 <b>v1.9（维护模式）</b> 的文档 —— 部分端点已标记弃用，新项目请使用 <b>v2.4</b>。<button style="color:var(--warn);font-weight:700;text-decoration:underline;text-underline-offset:3px" onclick="setVer('v24')">切换到 v2.4 →</button></div>

  <aside class="sidebar" id="sidebar"></aside>

  <article class="art" id="art"></article>

  <aside class="toc"><div class="t">本页目录</div><div id="tocList"></div>
    <div class="footline">© 2026 Atlas API<br><a href="../../" style="color:var(--acc)">← shufy 作品站</a></div>
  </aside>
</div>

  <div class="sm" role="dialog" aria-label="搜索文档">
    <div class="sm-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="smIn" placeholder="搜索页面、端点、参数…" /><span class="esc">ESC</span></div>
    <div class="sm-res" id="smRes"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* ==================== 内容 ==================== */
/* 代码高亮（极简 token 处理，仅用于展示） */
function hi(code){
  return code
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/(#.*$)/gm,'<span class="tok-c">$1</span>')
    .replace(/(\/\/.*$)/gm,'<span class="tok-c">$1</span>')
    .replace(/"([^"]*)"/g,'<span class="tok-s">"$1"</span>')
    .replace(/\b(curl|const|await|fetch|new|return|import|from|export|async|function|let|print|require|def|true|false|null|None|True)\b/g,'<span class="tok-k">$1</span>')
    .replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="tok-n">$1</span>')
    .replace(/\b(atlas|messages|list|create|Authorization|Bearer|GET|POST)\b/g,'<span class="tok-f">$1</span>');
}
function codeBlock(fn,tabs,active,actions){
  return `<div class="code"><div class="code-h"><span class="fn"><span class="dots"><i></i><i></i><i></i></span>${fn}</span>
    <div class="ctabs">${tabs.map((t,i)=>`<button class="${t===active?"on":""}" data-ct="${t}">${t}</button>`).join("")}</div>
    <div class="code-actions">${actions||""}</div></div>
    <div class="code-panes">${tabs.map((t,i)=>`<pre data-ctp="${t}" ${t===active?"":'hidden'}></pre>`).join("")}</div>
    <div class="cout"><div class="cl"><span>OUTPUT · 运行结果</span><button class="cbtn" onclick="this.closest('.cout').classList.remove('show')">关闭</button></div><pre></pre></div></div>`;
}
/* 各语言示例（随版本变化 base URL） */
function snippet(kind,lang,VER){
  const B=VER==="v19"?"https://api.atlas.dev/v1.9":"https://api.atlas.dev/v2";
  if(kind==="install"){
    if(lang==="cURL")return `# 安装官方 SDK（其余语言见对应仓库）\nnpm install atlas-sdk`;
    if(lang==="JavaScript")return `import { Atlas } from "atlas-sdk";`;
    if(lang==="Python")return `pip install atlas\n\nimport atlas`;
  }
  if(kind==="quick"){
    if(lang==="cURL")return `curl ${B}/messages \\\n  -H "Authorization: Bearer sk_live_51Hx…" \\\n  -H "Content-Type: application/json"`;
    if(lang==="JavaScript")return `import { Atlas } from "atlas-sdk";\n\nconst atlas = new Atlas("sk_live_51Hx…");\n\n// 拉取最近 5 条消息\nconst { data } = await atlas.messages.list({ limit: 5 });\nconsole.log(data.map(m => m.content));`;
    if(lang==="Python")return `import atlas\n\nclient = atlas.Client("sk_live_51Hx…")\n\n# 拉取最近 5 条消息\nmessages = client.messages.list(limit=5)\nfor m in messages.data:\n    print(m.content)`;
  }
  if(kind==="auth"){
    if(lang==="cURL")return `curl ${B}/messages \\\n  -H "Authorization: Bearer sk_live_51Hx…"`;
    if(lang==="JavaScript")return `// 密钥放在服务端，切勿暴露到浏览器\nconst atlas = new Atlas(process.env.ATLAS_KEY);\n\n// 已收到请求即视为已认证\n// 无效密钥会返回 401 invalid_api_key`;
    if(lang==="Python")return `import os\nclient = atlas.Client(os.environ["ATLAS_KEY"])`;
  }

  $$(".code").forEach(cd=>{
    const fn=cd.querySelector(".fn").textContent.trim();

        else if(fn.includes("GET")&&fn.includes("/messages"))kind="quick";
        else kind="auth";

      }
    });

    cd.querySelector(".ctabs").addEventListener("click",e=>{
      const b=e.target.closest("[data-ct]");if(!b)return;
      [...cd.querySelectorAll("[data-ct]")].forEach(x=>x.classList.toggle("on",x===b));
      panes.forEach(pre=>pre.hidden=pre.dataset.ctp!==b.dataset.ct);
    });
    /* 复制 */
    const cp=cd.querySelector("[data-copy]");
    if(cp)cp.addEventListener("click",()=>{
      const vis=panes.find(p=>!p.hidden);
      navigator.clipboard&&navigator.clipboard.writeText(vis.textContent);

    });
    /* 运行 */
    const run=cd.querySelector("[data-run]");
    if(run)run.addEventListener("click",()=>{
      const out=cd.querySelector(".cout"),pre=out.querySelector("pre");
      pre.textContent="$ 正在通过 SDK 发起请求…";
      out.classList.add("show");
      setTimeout(()=>{
        if(run.dataset.run==="quick"){
          pre.innerHTML=`<span class="tok-c">console</span> 共拉取 5 条消息\n`+RESPONSES.list;
        } else {
          pre.innerHTML=`<span class="tok-c">console</span> 已创建消息: msg_9x3Tp\n`+RESPONSES.create;

      },650);

    if(!cd.querySelector("[data-copy]")){
      const b=document.createElement("button");b.className="cbtn";b.dataset.copy="";b.textContent="复制";

      });
    }
  });
  $("#art").scrollTop=0;scrollTo(0,0);

function buildIndex(){
  const idx=[];
  for(const [k,p] of Object.entries(PAGES)){
    const tmp=document.createElement("div");
    tmp.innerHTML=p.html(VER);
    tmp.querySelectorAll("style,script").forEach(n=>n.remove());
    const text=tmp.textContent.replace(/\s+/g," ").trim();
    idx.push({page:k,title:p.title,group:p.group,heading:"",text});
    tmp.querySelectorAll("h2[id]").forEach(h=>{
      let t=h.textContent,snip="";
      let n=h.nextElementSibling;
      while(n&&!/^H2$/.test(n.tagName)&&snip.length<130){snip+=" "+n.textContent;n=n.nextElementSibling;}
      idx.push({page:k,title:p.title+" → "+t.trim(),group:p.group,heading:t.trim(),text:snip.replace(/\s+/g," ").trim()});
    });
  }
  return idx;
}
let INDEX=[];
function searchOpen(){
  INDEX=buildIndex();
  $("#smOv").classList.add("open");
  $("#smIn").value="";smRender("");
  setTimeout(()=>$("#smIn").focus(),40);
}
function searchClose(){$("#smOv").classList.remove("open");}
$("#searchBtn").addEventListener("click",searchOpen);
$("#smOv").addEventListener("click",e=>{if(e.target.id==="smOv")searchClose();});
addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#smOv").classList.contains("open")?searchClose():searchOpen();}
  if(e.key==="Escape")searchClose();
});
let smHits=[],smSel=0;
function hl(text,q){
  if(!q)return text.slice(0,120);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return text.slice(0,120);
  const s=Math.max(0,i-40);
  return (s>0?"…":"")+text.slice(s,i)+'<mark>'+text.slice(i,i+q.length)+'</mark>'+text.slice(i+q.length,i+q.length+90)+"…";
}
function smRender(q){
  const box=$("#smRes");smSel=0;
  if(!q.trim()){
    smHits=Object.entries(PAGES).map(([k,p])=>({page:k,title:p.title,group:p.group,text:""})).slice(0,6);
    box.innerHTML='<div class="sm-g">快速跳转</div>'+smHits.map((h,i)=>smItem(h,i,"")).join("");
    return;
  }
  const kw=q.toLowerCase();
  smHits=INDEX.filter(x=>(x.title+" "+x.text).toLowerCase().includes(kw)).slice(0,12);
  if(!smHits.length){box.innerHTML='<div class="sm-empty">没有找到「'+q.replace(/</g,"&lt;")+'」相关内容<br><span style="font-size:12px">试试「认证」「消息」「错误」或「cursor」</span></div>';return;}
  const byG={};smHits.forEach(h=>{(byG[h.group]=byG[h.group]||[]).push(h);});
  let html="",i=0;
  for(const g of GROUPS){
    if(!byG[g])continue;
    html+=`<div class="sm-g">${g}</div>`+byG[g].map(h=>smItem(h,i++,q)).join("");
  }
  box.innerHTML=html;smMark();
}
function smItem(h,i,q){
  return `<button class="sm-i ${i===0?"sel":""}" data-hit="${h.page}" data-i="${i}">
    <span class="ic">§</span><span><b>${h.title}</b><small>${hl(h.text,q)||"打开页面"}</small></span>
    <span class="enter"><kbd>↵</kbd></span></button>`;
}
function smMark(){$$("#smRes .sm-i").forEach((el,i)=>el.classList.toggle("sel",i===smSel));const s=$("#smRes .sm-i.sel");if(s)s.scrollIntoView({block:"nearest"});}
$("#smIn").addEventListener("input",e=>smRender(e.target.value));
$("#smRes").addEventListener("click",e=>{const b=e.target.closest("[data-hit]");if(b){searchClose();go(b.dataset.hit);}});
$("#smIn").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();smSel=Math.min(smHits.length-1,smSel+1);smMark();}
  else if(e.key==="ArrowUp"){e.preventDefault();smSel=Math.max(0,smSel-1);smMark();}
  else if(e.key==="Enter"){const hit=$("#smRes .sm-i.sel");if(hit){searchClose();go(hit.dataset.hit);}}
});

/* 修复 codeBlock 模板里注入的 hidden script-like 占位（无实际作用） */
$$("script-like").forEach(n=>n.remove());

pageRender();
</script>
