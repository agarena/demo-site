<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="description" content="声浪 SONOWAVE · 新拟态 Neumorphism 风格在线音乐播放器（概念演示，歌曲与歌手均为虚构）">
<title>声浪 SONOWAVE · 新拟态音乐播放器</title>
<style>
/* ==========================================================================
   声浪 SONOWAVE · 新拟态 Neumorphism 音乐播放器
   规格依据：11-style-gap.md「新拟态 Neumorphism」实施规格
   #E0E5EC 同色底 / 双光源内外阴影 / 凸起-凹陷状态语言 / 主题色仅点缀
   ========================================================================== */
:root{
  /* ---- 配色（共 6 色，严格按规格） ---- */
  --bg:            #E0E5EC;  /* 浅灰蓝同色底 */
  --shadow-light:  #FFFFFF;  /* 亮影：左上光源 */
  --shadow-dark:   #A3B1C6;  /* 暗影：右下光源 */
  --ink:           #4A5568;  /* 正文（对比度 ≥4.5:1） */
  --ink-soft:      #8898AA;  /* 弱文字 */
  --accent:        #6C63FF;  /* 主题色：仅图标与进度已过部分 */
  --accent-soft:   #8B84FF;

  /* ---- 圆角与阴影语言 ---- */
  --r-lg: 24px;
  --r-md: 18px;
  --r-sm: 14px;
  /* 凸起：左上亮 / 右下暗，模糊 ≥ 位移 */
  --raise:    9px 9px 18px var(--shadow-dark), -9px -9px 18px var(--shadow-light);
  --raise-md: 7px 7px 14px var(--shadow-dark), -7px -7px 14px var(--shadow-light);
  --raise-sm: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
  --raise-xs: 4px 4px 8px  var(--shadow-dark), -4px -4px 8px  var(--shadow-light);
  /* 凹陷：同值 inset */
  --inset:    inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
  --inset-md: inset 4px 4px 9px  var(--shadow-dark), inset -4px -4px 9px  var(--shadow-light);
  --inset-sm: inset 3px 3px 6px  var(--shadow-dark), inset -3px -3px 6px  var(--shadow-light);

  --font: "Poppins","PingFang SC","Microsoft YaHei",sans-serif;
  --ease: cubic-bezier(.4,0,.2,1);
}

*{ margin:0; padding:0; box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; }

body{
  background:var(--bg);           /* body 与卡片必须同底色 */
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
  padding:26px 28px 46px;
}

button{
  font-family:inherit;
  color:inherit;
  background:none;
  border:none;
  cursor:pointer;
}
button:disabled{ cursor:not-allowed; }

input{ font-family:inherit; }

ul,ol{ list-style:none; }

svg{ display:block; flex:none; }

/* 焦点可见性 */
:focus-visible{
  outline:3px solid rgba(108,99,255,.55);
  outline-offset:3px;
  border-radius:14px;
}

/* 时间码等宽数字 */
.tnum{ font-variant-numeric:tabular-nums; }

/* 屏幕阅读器专用 */
.sr-only{
  position:absolute; width:1px; height:1px;
  margin:-1px; padding:0; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* ==========================================================================
   顶栏
   ========================================================================== */
.topbar{
  max-width:1320px;
  margin:0 auto 30px;
  display:flex;
  align-items:center;
  gap:18px;
}

.brand{ display:flex; align-items:center; gap:14px; }

.brand-mark{
  width:52px; height:52px;
  border-radius:50%;
  background:var(--bg);
  box-shadow:var(--raise-sm);
  display:flex; align-items:center; justify-content:center;
  color:var(--accent);
}

.brand-name{
  font-size:22px;
  font-weight:700;
  letter-spacing:.06em;
  line-height:1.2;
}
.brand-name small{
  display:block;
  font-size:11px;
  font-weight:600;
  letter-spacing:.42em;
  color:var(--ink-soft);
}

.top-tag{
  margin-left:auto;
  padding:10px 20px;
  border-radius:999px;
  box-shadow:var(--inset-sm);      /* 凹陷徽章 = 开启态语言 */
  font-size:12px;
  letter-spacing:.18em;
  color:var(--ink-soft);
  white-space:nowrap;
}
.top-tag b{ color:var(--accent); font-weight:600; }

/* ==========================================================================
   三栏布局：歌单侧栏 / 播放器卡片 / 歌曲列表
   ========================================================================== */
.layout{
  max-width:1320px;
  margin:0 auto;
  display:grid;
  grid-template-columns:258px 396px minmax(0,1fr);
  gap:30px;
  align-items:start;
}

.panel{
  background:var(--bg);
  border-radius:var(--r-lg);
  box-shadow:var(--raise);
  padding:24px;
}

.panel-title{
  font-size:12px;
  font-weight:700;
  letter-spacing:.3em;
  color:var(--ink-soft);
  margin-bottom:14px;
}

/* --------------------------------------------------------------------------
   侧栏 · 歌单 / 榜单
   -------------------------------------------------------------------------- */
.sidebar{ position:sticky; top:26px; }
.sidebar .panel-title{ display:flex; align-items:center; gap:8px; }
.sidebar .panel-title i{
  width:6px; height:6px; border-radius:50%;
  background:var(--accent); opacity:.7;
}

.side-group + .side-group{ margin-top:26px; }

.side-list{ display:flex; flex-direction:column; gap:12px; }

.side-item{
  display:flex; align-items:center; gap:12px;
  width:100%;
  padding:9px 14px 9px 9px;
  border-radius:var(--r-sm);
  background:var(--bg);
  box-shadow:var(--raise-xs);       /* 凸起胶囊 */
  text-align:left;
  transition:box-shadow .12s var(--ease), transform .12s var(--ease);
}
.side-item:hover{ transform:translateY(-2px); box-shadow:var(--raise-sm); }
.side-item:active{ box-shadow:var(--inset-sm); transform:none; }
.side-item.is-active{ box-shadow:var(--inset-sm); }  /* 当前项 = 凹陷 */

.side-cover{
  width:40px; height:40px; flex:none;
  border-radius:11px;
  display:flex; align-items:center; justify-content:center;
  font-size:17px; font-weight:700;
  color:rgba(255,255,255,.92);
  text-shadow:0 1px 2px rgba(74,85,104,.25);
  /* 同色系浮雕渐变封面：hsl 由 --h 提供 */
  background:
    radial-gradient(circle at 28% 24%, rgba(255,255,255,.35) 0 22%, transparent 23%),
    linear-gradient(135deg, hsl(var(--h) 44% 82%), hsl(var(--h) 36% 62%));
  box-shadow:var(--raise-xs);
}
.side-cover.is-inset{ box-shadow:var(--inset-sm); }

.side-name{
  flex:1; min-width:0;
  font-size:14px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.side-item.is-active .side-name{ color:var(--accent); }

.side-count{
  font-size:12px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
}

/* --------------------------------------------------------------------------
   播放器卡片（380px 居中）
   -------------------------------------------------------------------------- */
.player-card{
  width:380px;
  border-radius:var(--r-lg);
  box-shadow:var(--raise);
  padding:30px 28px 26px;
  display:flex; flex-direction:column; align-items:center;
  position:sticky; top:26px;
}

.np-context{
  font-size:12px;
  letter-spacing:.12em;
  color:var(--ink-soft);
  margin-bottom:18px;
  text-align:center;
  max-width:100%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.np-context.is-live{ color:var(--accent); font-weight:600; }

/* 封面凹槽 + 浮雕封面 */
.cover-slot{
  width:100%;
  border-radius:var(--r-lg);
  box-shadow:var(--inset);          /* 凹陷封面槽 */
  padding:16px;
  margin-bottom:22px;
}

.cover{
  position:relative;
  width:100%; aspect-ratio:1/1;
  border-radius:var(--r-md);
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--raise-md);       /* 封面从凹槽中浮起 */
  background:
    repeating-radial-gradient(circle at 50% 50%,
      rgba(255,255,255,.06) 0 2px, transparent 2px 10px),
    linear-gradient(135deg, hsl(var(--h) 46% 84%), hsl(var(--h) 38% 60%));
}
.cover::before{                    /* 左上高光，呼应双光源 */
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(145deg, rgba(255,255,255,.4) 0%, transparent 42%);
  pointer-events:none;
}
.cover-char{
  font-size:76px; font-weight:700;
  color:rgba(255,255,255,.9);
  text-shadow:0 2px 10px rgba(74,85,104,.28);
  user-select:none;
}
.cover-disc{                       /* 唱片同心圆装饰 */
  position:absolute;
  width:66%; aspect-ratio:1/1;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.35);
  box-shadow:0 0 0 14px rgba(255,255,255,.07), 0 0 0 28px rgba(255,255,255,.05);
  pointer-events:none;
}
.cover-badge{
  position:absolute; right:12px; bottom:12px;
  width:38px; height:38px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:#fff;
  background:linear-gradient(135deg, var(--accent-soft), var(--accent));
  box-shadow:3px 3px 7px rgba(74,85,104,.3), -2px -2px 5px rgba(255,255,255,.35);
}

/* 播放中：双光源内外阴影强度随节拍呼吸（--cv 由节拍引擎逐帧写入，柔拍感） */
.cover.is-live{
  box-shadow:
    calc(7px + var(--cv, 0) * 3px) calc(7px + var(--cv, 0) * 3px) calc(14px + var(--cv, 0) * 9px) var(--shadow-dark),
    calc(-7px - var(--cv, 0) * 3px) calc(-7px - var(--cv, 0) * 3px) calc(14px + var(--cv, 0) * 9px) var(--shadow-light),
    inset 0 0 calc(var(--cv, 0) * 14px) rgba(163, 177, 198, calc(var(--cv, 0) * .28)),
    inset 0 0 calc(var(--cv, 0) * 10px) rgba(255, 255, 255, calc(var(--cv, 0) * .32)),
    0 0 calc(var(--cv, 0) * 18px) rgba(108, 99, 255, calc(var(--cv, 0) * .12));
}
.cover.is-live .cover-char,
.cover.is-live .cover-disc{
  transform:scale(calc(1 + var(--cv, 0) * .015));   /* 封面内容缩放 ≤1.5% */
}

.np-title{
  font-size:20px; font-weight:700;
  max-width:100%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  text-align:center;
}
.np-artist{
  font-size:13px;
  color:var(--ink-soft);
  margin:4px 0 20px;
  max-width:100%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ---- 均衡器凹槽：凹槽内 7 根主题紫小柱，高度由节拍引擎驱动 ---- */
.eq-groove{
  width:100%;
  height:40px;
  margin:-8px 0 16px;
  padding:7px 14px;
  border-radius:12px;
  box-shadow:var(--inset-sm);       /* 凹槽语言 */
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:8px;
}
.eq-groove i{
  width:6px; height:100%;
  border-radius:3px;
  background:var(--accent);         /* 主题紫 */
  opacity:.78;
  transform-origin:bottom;
  transform:scaleY(.24);            /* 静息基线；播放中由节拍引擎写入 */
  transition:filter .18s var(--ease);
}
.eq-groove.is-down i{ filter:brightness(1.14); }   /* 重拍：亮度轻提 */

/* ---- 凹槽滑块（进度 / 音量通用） ---- */
.slider{
  --p:0%;                           /* 填充比例，由 JS 写入 */
  position:relative;
  width:100%;
  height:34px;                      /* 含触控热区 */
  display:flex; align-items:center;
  cursor:pointer;
  touch-action:none;
  border-radius:999px;
}
.slider-track{
  position:relative;
  width:100%; height:12px;
  border-radius:8px;
  background:var(--bg);
  box-shadow:var(--inset-sm);       /* 凹槽 */
}
.slider-fill{
  position:absolute;
  top:3px; bottom:3px; left:3px;
  width:max(0px, calc(var(--p) - 3px));
  border-radius:6px;
  background:linear-gradient(90deg, var(--accent-soft), var(--accent));
  box-shadow:1px 1px 3px rgba(74,85,104,.25);
}
.slider-fill.zero{ width:0; }
.slider-thumb{
  position:absolute;
  top:50%; left:var(--p);
  width:20px; height:20px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:var(--bg);
  box-shadow:var(--raise-xs);       /* 凸起圆点 */
  transition:transform .12s var(--ease);
}
.slider:hover .slider-thumb{ transform:translate(-50%,-50%) scale(1.12); }
.slider.dragging .slider-thumb{ transform:translate(-50%,-50%) scale(1.2); }

/* 进度节拍光珠：已过部分端点随拍脉动（--orb / --orb-o 由节拍引擎写入） */
.beat-orb{
  position:absolute;
  top:50%; left:var(--p, 0%);
  width:10px; height:10px;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(calc(.72 + var(--orb, 0) * .4));
  background:radial-gradient(circle at 35% 32%, #FFFFFF 0 22%, var(--accent-soft) 58%, var(--accent));
  box-shadow:0 0 calc(var(--orb, 0) * 12px) rgba(108, 99, 255, calc(var(--orb, 0) * .72));
  opacity:var(--orb-o, 0);
  transition:opacity .18s var(--ease);
  pointer-events:none;
}

.progress-wrap{ width:100%; margin-bottom:6px; }
.time-row{
  display:flex; justify-content:space-between;
  font-size:13px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  margin-bottom:14px;
}

/* ---- 控制按钮组 ---- */
.controls{
  display:flex; align-items:center; justify-content:center;
  gap:16px;
  margin-bottom:22px;
}

.btn{
  width:48px; height:48px; flex:none;
  border-radius:50%;
  background:var(--bg);
  box-shadow:var(--raise-sm);       /* 凸起（未按） */
  display:flex; align-items:center; justify-content:center;
  color:var(--ink);
  transition:box-shadow .12s var(--ease), color .12s var(--ease), transform .12s var(--ease);
}
.btn:hover{ box-shadow:var(--raise-md); color:var(--accent); }
.btn:active{ box-shadow:var(--inset-sm); }   /* 按下 = 凹陷 */
.btn.is-on{ box-shadow:var(--inset-sm); color:var(--accent); }  /* 激活 = 凹陷 */

.btn-sm{ width:44px; height:44px; }
.btn-sm svg{ width:20px; height:20px; }
.btn svg{ width:22px; height:22px; }

/* 大圆形播放键 64px */
.play-btn{
  width:64px; height:64px;
  box-shadow:var(--raise);
}
.play-btn:hover{ box-shadow:11px 11px 20px var(--shadow-dark), -11px -11px 20px var(--shadow-light); }
.play-btn:active{ box-shadow:var(--inset-md); }
.play-btn.is-playing{ box-shadow:var(--inset-md); color:var(--accent); }  /* 播放中 = 激活凹陷 */
.play-btn svg{ width:26px; height:26px; }

.play-btn .i-pause{ display:none; }
.play-btn.is-playing .i-pause{ display:block; }
.play-btn.is-playing .i-play{ display:none; }

/* 播放中：凹凸状态随节拍在凸起↔浅凹间轻柔往复（--pb 0 凸起 → 1 浅凹，重拍更深），
   像被音乐轻轻按动。外层凸起对随 --pb 收缩、内层凹陷对随之生长，两段阴影交叉过渡 */
.play-btn.is-playing{
  box-shadow:
    calc(9px - var(--pb, 0) * 9px) calc(9px - var(--pb, 0) * 9px) calc(18px - var(--pb, 0) * 18px) var(--shadow-dark),
    calc(-9px + var(--pb, 0) * 9px) calc(-9px + var(--pb, 0) * 9px) calc(18px - var(--pb, 0) * 18px) var(--shadow-light),
    inset calc(var(--pb, 0) * 4px) calc(var(--pb, 0) * 4px) calc(var(--pb, 0) * 9px) var(--shadow-dark),
    inset calc(var(--pb, 0) * -4px) calc(var(--pb, 0) * -4px) calc(var(--pb, 0) * 9px) var(--shadow-light);
  transition:none;                  /* 逐帧写入，节奏交由 rAF 导拍器掌控 */
}
.play-btn.is-playing:active{ box-shadow:var(--inset-md); }   /* 手动按压仍为凹陷 */

/* 循环模式三态图标切换 */
.loop-btn svg{ display:none; }
.loop-btn[data-loop="order"]   .i-order{ display:block; }
.loop-btn[data-loop="one"]     .i-one{ display:block; }
.loop-btn[data-loop="shuffle"] .i-shuffle{ display:block; }

/* 收藏红心 */
.like-btn .i-heart-on{ display:none; }
.like-btn.is-on .i-heart-on{ display:block; }
.like-btn.is-on .i-heart-off{ display:none; }

/* ---- 音量行 ---- */
.volume-row{
  width:100%;
  display:flex; align-items:center; gap:12px;
}
.volume-row .slider{ flex:1; height:34px; }
.volume-row .slider-thumb{ width:20px; height:20px; }
.vol-val{
  width:38px;
  text-align:right;
  font-size:13px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
}

/* --------------------------------------------------------------------------
   歌曲列表面板
   -------------------------------------------------------------------------- */
.list-head{
  display:flex; align-items:baseline; gap:12px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.list-title{ font-size:20px; font-weight:700; }
.list-sub{
  font-size:12px;
  letter-spacing:.14em;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
}

/* 搜索凹槽 */
.search-box{
  display:flex; align-items:center; gap:10px;
  border-radius:999px;
  box-shadow:var(--inset-sm);
  padding:11px 18px;
  margin-bottom:20px;
  color:var(--ink-soft);
}
.search-box input{
  flex:1; min-width:0;
  border:none; outline:none;
  background:transparent;
  font-size:14px;
  color:var(--ink);
}
.search-box input::placeholder{ color:var(--ink-soft); }
.search-box:focus-within{ box-shadow:var(--inset-md); }
.search-box:focus-within .search-ico{ color:var(--accent); }

/* 歌曲行 = 凸起胶囊 */
.song-scroll{ max-height:652px; overflow-y:auto; padding:4px 6px 4px 2px; margin-right:-6px; }
.song-scroll::-webkit-scrollbar{ width:8px; }
.song-scroll::-webkit-scrollbar-thumb{
  border-radius:8px;
  background:rgba(163,177,198,.55);
  border:2px solid var(--bg);
}
.song-scroll::-webkit-scrollbar-track{ background:transparent; }

.song-list{ display:flex; flex-direction:column; gap:12px; }

.row{
  display:flex; align-items:center; gap:6px;
  padding:8px 8px 8px 16px;
  border-radius:var(--r-sm);
  background:var(--bg);
  box-shadow:var(--raise-xs);
  transition:box-shadow .12s var(--ease), transform .12s var(--ease);
}
.row:hover{ transform:translateY(-2px); box-shadow:var(--raise-sm); }
.row.playing{                      /* 播放行 = 凹陷高亮 */
  box-shadow:var(--inset-sm);
  transform:none;
}

.row-main{
  flex:1; min-width:0;
  display:flex; align-items:center; gap:14px;
  text-align:left;
  border-radius:12px;
  padding:2px 0;
}

.row-index{
  width:28px; flex:none;
  text-align:center;
  font-size:13px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
}

/* 跳动音柱（仅播放行出现；高度由节拍引擎驱动，暂停时静止） */
.bars{
  width:28px; height:16px; flex:none;
  display:none;
  align-items:flex-end; justify-content:center;
  gap:3px;
}
.row.playing .bars{ display:inline-flex; }
.row.playing .row-index{ display:none; }
.bars i{
  width:3px; height:100%;
  border-radius:2px;
  background:var(--accent);
  transform-origin:bottom;
  transform:scaleY(.55);            /* 静止基线；播放中由节拍引擎逐帧写入 */
}

.row-cover{
  width:42px; height:42px; flex:none;
  border-radius:11px;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:700;
  color:rgba(255,255,255,.92);
  text-shadow:0 1px 2px rgba(74,85,104,.25);
  background:
    radial-gradient(circle at 28% 24%, rgba(255,255,255,.35) 0 22%, transparent 23%),
    linear-gradient(135deg, hsl(var(--h) 44% 82%), hsl(var(--h) 36% 62%));
  box-shadow:2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light);
}
.row.playing .row-cover{ box-shadow:var(--inset-sm); }

.row-meta{ flex:1; min-width:0; }
.row-title{
  display:block;
  font-size:14px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.row.playing .row-title{ color:var(--accent); }
.row-artist{
  display:block;
  font-size:12px;
  color:var(--ink-soft);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.row-dur{
  flex:none;
  font-size:13px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  margin-right:6px;
}

/* BPM 小标注：凹陷小徽签 */
.row-bpm{
  flex:none;
  padding:3px 9px;
  border-radius:999px;
  box-shadow:var(--inset-sm);
  font-size:10px;
  font-weight:600;
  letter-spacing:.06em;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.row.playing .row-bpm{ color:var(--accent); }

.row-like{
  width:44px; height:44px; flex:none;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft);
  transition:box-shadow .12s var(--ease), color .12s var(--ease);
}
.row-like:hover{ color:var(--accent); box-shadow:var(--inset-sm); }
.row-like:active{ box-shadow:var(--inset-sm); }
.row-like.is-on{ color:var(--accent); }
.row-like svg{ width:19px; height:19px; }
.row-like .i-heart-on{ display:none; }
.row-like.is-on .i-heart-on{ display:block; }
.row-like.is-on .i-heart-off{ display:none; }

/* 空状态 */
.empty{
  display:none;
  flex-direction:column; align-items:center; gap:14px;
  padding:56px 20px;
  text-align:center;
  color:var(--ink-soft);
}
.empty.is-show{ display:flex; }
.empty-ico{
  width:72px; height:72px;
  border-radius:50%;
  box-shadow:var(--inset-sm);
  display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft);
}
.empty-ico svg{ width:30px; height:30px; }
.empty-text{ font-size:14px; }
.empty-text b{ color:var(--ink); font-weight:600; }

/* --------------------------------------------------------------------------
   页脚 / 轻提示
   -------------------------------------------------------------------------- */
.footer{
  max-width:1320px;
  margin:36px auto 0;
  text-align:center;
  font-size:12px;
  letter-spacing:.1em;
  color:var(--ink-soft);
}

.toast{
  position:fixed;
  left:50%; bottom:34px;
  transform:translate(-50%, 16px);
  padding:12px 26px;
  border-radius:999px;
  background:var(--bg);
  box-shadow:var(--raise-md);
  font-size:14px;
  color:var(--ink);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s var(--ease), transform .2s var(--ease);
  z-index:100;
}
.toast.is-show{ opacity:1; transform:translate(-50%,0); }
.toast b{ color:var(--accent); font-weight:600; }

/* ==========================================================================
   响应式：三档 ≥1200 / 768 / 375
   ========================================================================== */
@media (max-width:1199px){
  body{ padding:22px 22px 40px; }
  .layout{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    max-width:900px;
    gap:24px;
  }
  .sidebar{ grid-column:1 / -1; position:static; }
  .side-list{ flex-direction:row; flex-wrap:wrap; }
  .side-item{ width:auto; flex:1 1 190px; }
  .side-group + .side-group{ margin-top:18px; }
  .player-card{ position:static; }
  .song-scroll{ max-height:none; overflow:visible; }
}

@media (max-width:767px){
  body{ padding:18px 14px 36px; }
  .topbar{ flex-wrap:wrap; justify-content:center; text-align:center; margin-bottom:22px; }
  .top-tag{ display:none; }
  .layout{
    grid-template-columns:minmax(0,1fr);
    max-width:440px;
    gap:22px;
  }
  /* 移动端：播放器居中置顶 */
  .player-card{
    order:-1;
    width:min(380px, 100%);
    margin:0 auto;
  }
  .sidebar .panel,
  .list-panel{ padding:18px; }
  .side-list{ flex-direction:column; }
  .side-item{ flex:none; width:100%; }
  .cover-slot{ padding:12px; }
  .cover-char{ font-size:62px; }
  .controls{ gap:12px; }
  .toast{ bottom:22px; width:max-content; max-width:88vw; }
}

/* 尊重减少动态偏好：律动全部关闭，一切回到静态浮雕 */
@media (prefers-reduced-motion:reduce){
  .bars i{ transform:scaleY(.55) !important; }
  .eq-groove i{ transform:scaleY(.32) !important; }
  .beat-orb{ display:none; }
  .cover.is-live{ box-shadow:var(--raise-md) !important; }
  .cover.is-live .cover-char,
  .cover.is-live .cover-disc{ transform:none !important; }
  .play-btn.is-playing{ box-shadow:var(--inset-md) !important; }
  *{ transition-duration:.01ms !important; }
}

  /* ---------------- SVG 片段 ---------------- */
  var ICON_HEART_OFF =
    '<svg class="i-heart-off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
    '<path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>';
  var ICON_HEART_ON =
    '<svg class="i-heart-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
    '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

  /* ---------------- 侧栏渲染 ---------------- */
  function sideItemHTML(item, count, isActive, isIcon, hue, charText){

  function renderSidebar(){

    html += sideItemHTML(LIB[0], ALL_IDS.length, state.view === "all", "note", 222, "");
    html += sideItemHTML(LIB[1], likeCount(), state.view === "fav", "heart", 338, "");

  /* ---------------- 歌曲列表渲染 ---------------- */
  function rowHTML(song, index){
    var playing = song.id === state.currentId;
    var liked = isLiked(song.id);
    return '<li class="row' + (playing ? " playing" : "") + '" data-id="' + song.id + '">' +
      '<button type="button" class="row-main" aria-label="播放 ' + song.title + ' - ' + song.artist + '">' +
        '<span class="row-index tnum">' + (index < 9 ? "0" + (index + 1) : (index + 1)) + '</span>' +
        '<span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>' +
        '<span class="row-cover" style="--h:' + song.h + '" aria-hidden="true">' + song.title.charAt(0) + '</span>' +
        '<span class="row-meta">' +
          '<span class="row-title">' + song.title + '</span>' +
          '<span class="row-artist">' + song.artist + '</span>' +
        '</span>' +
        '<span class="row-bpm tnum" title="每分钟节拍数">' + song.bpm + ' BPM</span>' +
        '<span class="row-dur tnum">' + fmt(song.dur) + '</span>' +
      '</button>' +
      '<button type="button" class="row-like' + (liked ? " is-on" : "") + '" data-like="' + song.id + '"' +
        ' aria-label="' + (liked ? "取消收藏 " : "收藏 ") + song.title + '" aria-pressed="' + liked + '">' +
        ICON_HEART_OFF + ICON_HEART_ON +

    '</li>';

  function renderList(){
    var view = getView();
    var base = view.ids;
    var q = state.query.trim().toLowerCase();
    var ids = base;

    if (q){
      ids = base.filter(function(id){
        var s = songById(id);
        return s.title.toLowerCase().indexOf(q) !== -1 ||
               s.artist.toLowerCase().indexOf(q) !== -1;
      });
    }

    var listEl = $("song-list");
    if (ids.length > 0){
      listEl.innerHTML = ids.map(function(id, i){ return rowHTML(songById(id), i); }).join("");
      $("empty-box").classList.remove("is-show");
    } else {
      listEl.innerHTML = "";
      $("empty-box").classList.add("is-show");
      $("empty-text").innerHTML = q
        ? '没有找到与 <b>「' + state.query.trim() + '」</b> 匹配的歌曲'
        : '选择一首歌，点亮这个房间';
    }

    $("view-name").textContent = view.name;
    $("view-count").textContent = q
      ? "筛选 " + ids.length + " / " + base.length + " 首"
      : "共 " + base.length + " 首";
    refreshPlayingBars();       /* 列表 DOM 重建后刷新播放行音柱引用 */
  }

  /* ---------------- 播放器渲染 ---------------- */
  function renderPlayer(){
    var s = songById(state.currentId);
    var cover = $("np-cover");
    cover.style.setProperty("--h", s.h);
    cover.classList.toggle("is-live", state.playing);   /* 播放中封面进入光影呼吸 */
    $("np-char").textContent = s.title.charAt(0);
    $("np-title").textContent = s.title;
    $("np-artist").textContent = s.artist;
    $("t-dur").textContent = fmt(s.dur);

    var ctx = $("np-context");
    if (!state.started){
      ctx.textContent = "选择一首歌，点亮这个房间";
      ctx.classList.remove("is-live");
    } else {
      ctx.textContent = (state.playing ? "正在播放" : "已暂停") +
        (state.contextName ? " · 来自「" + state.contextName + "」" : "");
      ctx.classList.add("is-live");
    }

    var playBtn = $("play-btn");
    playBtn.classList.toggle("is-playing", state.playing);
    playBtn.setAttribute("aria-label", state.playing ? "暂停" : "播放");

    var likeBtn = $("np-like");
    var liked = isLiked(state.currentId);
    likeBtn.classList.toggle("is-on", liked);
    likeBtn.setAttribute("aria-pressed", liked ? "true" : "false");
    likeBtn.setAttribute("aria-label", (liked ? "取消收藏 " : "收藏 ") + s.title);
  }

  function renderLoop(){
    var btn = $("loop-btn");
    btn.dataset.loop = state.loop;
    var names = { order:"顺序循环", one:"单曲循环", shuffle:"随机播放" };
    btn.setAttribute("aria-label", "循环模式：" + names[state.loop]);
    btn.classList.toggle("is-on", state.loop !== "order");  // 开启态 = 凹陷
  }

  function renderMute(){
    var btn = $("mute-btn");
    var showMute = state.muted || state.volume === 0;
    btn.dataset.muted = showMute ? "on" : "off";
    btn.querySelector(".i-vol").style.display  = showMute ? "none" : "block";
    btn.querySelector(".i-mute").style.display = showMute ? "block" : "none";
    btn.setAttribute("aria-label", showMute ? "取消静音" : "静音");
    btn.classList.toggle("is-on", showMute);                // 静音 = 凹陷
  }

  function renderSeek(){
    var s = songById(state.currentId);
    var ratio = s.dur > 0 ? state.pos / s.dur : 0;
    ratio = Math.min(1, Math.max(0, ratio));
    var pct = (ratio * 100).toFixed(2) + "%";
    var slider = $("seek");
    slider.style.setProperty("--p", pct);
    $("seek-fill").classList.toggle("zero", ratio <= 0);
    slider.setAttribute("aria-valuemax", s.dur);
    slider.setAttribute("aria-valuenow", Math.floor(state.pos));
    slider.setAttribute("aria-valuetext", fmt(state.pos) + " / " + fmt(s.dur));
    $("t-cur").textContent = fmt(state.pos);
  }

  function renderVolume(){
    var pct = state.volume + "%";
    var slider = $("volume");
    slider.style.setProperty("--p", pct);
    $("vol-fill").classList.toggle("zero", state.volume <= 0);
    slider.setAttribute("aria-valuenow", state.volume);
    $("vol-val").textContent = state.volume;
  }

  function renderAll(){
    renderSidebar();
    renderList();
    renderPlayer();
    renderLoop();
    renderMute();
    renderSeek();
    renderVolume();
  }

  /* ---------------- 播放状态机（模拟计时） ---------------- */
  function playSong(id, queueIds, contextName){
    if (queueIds && queueIds.length){
      state.queue = queueIds.slice();
      state.qIndex = Math.max(0, queueIds.indexOf(id));
    } else if (state.queue.indexOf(id) !== -1){
      state.qIndex = state.queue.indexOf(id);
    } else {
      state.queue = ALL_IDS.slice();
      state.qIndex = ALL_IDS.indexOf(id);
    }
    if (contextName) state.contextName = contextName;
    state.currentId = id;
    state.pos = 0;
    state.playing = true;
    state.started = true;
    renderPlayer();
    renderList();       // 更新播放行高亮与音柱
    renderSeek();
  }

  function togglePlay(){
    if (!state.started){
      // 尚未播放过：从当前视图第一首开始
      var view = getView();
      var ids = view.ids.length ? view.ids : ALL_IDS;
      playSong(ids[0], ids, view.name);
      toast("开始播放 <b>" + songById(state.currentId).title + "</b>");
      return;
    }
    state.playing = !state.playing;
    renderPlayer();
  }

  function pickNextIndex(dir){
    var len = state.queue.length;
    if (len <= 1) return state.qIndex;
    if (state.loop === "shuffle"){
      var next = state.qIndex;
      while (next === state.qIndex){
        next = Math.floor(Math.random() * len);
      }
      return next;
    }
    return (state.qIndex + dir + len) % len;
  }

  function skip(dir){
    var idx = pickNextIndex(dir);
    var id = state.queue[idx];
    playSong(id, state.queue, state.contextName);
  }

  function onSongEnd(){
    if (state.loop === "one"){
      state.pos = 0;
      renderSeek();
      return;
    }
    skip(1);
  }

  /* ---------------- 节拍引擎：rAF 导拍器 + 新拟态律动映射 ----------------
     每首歌自带 BPM；播放中由统一 rAF 循环按 state.pos 推导节拍
     （重拍 = 每小节首拍，4/4），广播节拍事件并驱动「光影呼吸」：
     只动阴影 / 亮度，位移与缩放 ≤1.5%，保持新拟态安静柔软的气质。
     节拍相位完全由播放位置推导 → 暂停 / 切歌 / 拖动进度天然正确启停。 */
  var REDUCED = !!(window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  var playBtnEl = $("play-btn");
  var coverEl   = $("np-cover");
  var seekEl    = $("seek");
  var eqBox     = $("eq-groove");
  var eqBars    = eqBox.querySelectorAll("i");
  var rowBars   = [];              /* 播放行音柱引用（renderList 后刷新） */

  var grooveOn      = false;       /* 律动激活中（停止后需回一次静态） */
  var lastBeatIndex = -1;
  var beatListeners = [];

  /* 节拍事件订阅：b = { index:拍序, down:是否重拍, bpm } */
  function onBeat(fn){ beatListeners.push(fn); }

  /* 重拍时给均衡器凹槽一点亮度提点（以亮度变化为主） */
  onBeat(function(b){
    eqBox.classList.toggle("is-down", b.down);
  });

  function refreshPlayingBars(){
    rowBars = document.querySelectorAll(".row.playing .bars i");
  }

  /* 柔和包络：约 90ms 起音 + 按拍长归一的指数衰减，像被音乐轻轻按动 */
  function beatEnv(phase, spb, peak){
    var t = phase * spb;
    var attack = Math.min(1, t / 0.09);
    return peak * attack * Math.exp(-3.2 * Math.max(0, t - 0.09) / spb);
  }

  function updateGroove(){
    var s   = songById(state.currentId);
    var spb = 60 / s.bpm;                     /* 每拍秒数 */
    var f   = state.pos / spb;
    var idx = Math.floor(f);
    var phase = f - idx;                      /* 拍内相位 0..1 */
    var down  = (idx % 4) === 0;              /* 重拍：每小节首拍 */

    if (idx !== lastBeatIndex){
      lastBeatIndex = idx;
      for (var i = 0; i < beatListeners.length; i++){
        beatListeners[i]({ index: idx, down: down, bpm: s.bpm });
      }
    }

    var env  = beatEnv(phase, spb, down ? 1 : 0.78);          /* 按动力 */
    var soft = beatEnv(phase, spb, down ? 1 : 0.8) * 0.82;    /* 封面呼吸更柔 */

    playBtnEl.style.setProperty("--pb", env.toFixed(3));
    coverEl.style.setProperty("--cv", soft.toFixed(3));
    seekEl.style.setProperty("--orb", env.toFixed(3));
    seekEl.style.setProperty("--orb-o", "1");

    /* 均衡器凹槽：7 根小柱做行波起伏（中间高、两侧低的声学曲线） */
    var n = eqBars.length;
    for (var k = 0; k < n; k++){
      var ph  = (phase + 1 - (k / n) * 0.55) % 1;
      var amp = 0.7 + 0.3 * Math.sin(Math.PI * (k + 1) / (n + 1));
      var h   = 0.22 + 0.78 * amp * Math.exp(-3.0 * ph) * (down ? 1 : 0.82);
      eqBars[k].style.transform = "scaleY(" + Math.min(1, h).toFixed(3) + ")";
    }

    /* 播放行音柱：3 根随拍跳动 */
    for (var j = 0; j < rowBars.length; j++){
      var pj = (phase + 1 - j * 0.14) % 1;
      var hj = 0.3 + 0.7 * Math.exp(-2.6 * pj) * (down ? 1 : 0.78);
      rowBars[j].style.transform = "scaleY(" + Math.min(1, hj).toFixed(3) + ")";
    }
  }

  /* 暂停 / 停止：全部律动回到静态值，无残留动画 */
  function calmGroove(){
    playBtnEl.style.removeProperty("--pb");
    coverEl.style.removeProperty("--cv");
    coverEl.classList.remove("is-live");
    seekEl.style.setProperty("--orb", "0");
    seekEl.style.setProperty("--orb-o", "0");
    eqBox.classList.remove("is-down");
    for (var k = 0; k < eqBars.length; k++){
      eqBars[k].style.transform = "scaleY(.24)";
    }
    for (var j = 0; j < rowBars.length; j++){
      rowBars[j].style.transform = "scaleY(.55)";
    }
    grooveOn = false;
  }

  /* 减少动态偏好若在会话中开启，立即静止 */
  if (window.matchMedia){
    var mqMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    var syncMotion = function(){
      REDUCED = mqMotion.matches;
      if (REDUCED && grooveOn) calmGroove();
    };
    if (mqMotion.addEventListener) mqMotion.addEventListener("change", syncMotion);
    else if (mqMotion.addListener) mqMotion.addListener(syncMotion);
  }

  /* rAF 模拟走秒 + 统一导拍（无真实音频） */
  var lastTs = performance.now();
  function tick(now){
    var dt = (now - lastTs) / 1000;
    lastTs = now;
    if (state.playing && state.started){
      state.pos += dt;
      var dur = songById(state.currentId).dur;
      if (state.pos >= dur){
        state.pos = dur;
        onSongEnd();
        if (state.pos >= songById(state.currentId).dur){
          state.pos = 0;  // 兜底：极短队列异常时归零
        }
      } else {
        renderSeek();
      }
      if (!REDUCED){
        grooveOn = true;
        updateGroove();     /* 节拍相位随 pos 推导，暂停/切歌/拖动自动正确 */
      }
    } else if (grooveOn){
      calmGroove();         /* 暂停：阴影一次性回到静态值 */
    }
    requestAnimationFrame(tick);
  }

  /* ---------------- 通用凹槽滑块（指针拖拽 + 键盘） ---------------- */
  function makeSlider(el, opts){
    var dragging = false;

    function ratioFromEvent(e){
      var rect = el.getBoundingClientRect();
      var x = e.clientX - rect.left;
      return Math.min(1, Math.max(0, x / rect.width));
    }

    function apply(e){
      var r = ratioFromEvent(e);
      el.classList.add("dragging");
      opts.onInput(r);
    }

    el.addEventListener("pointerdown", function(e){
      dragging = true;
      el.setPointerCapture(e.pointerId);
      apply(e);
      if (opts.onStart) opts.onStart();
      e.preventDefault();
    });
    el.addEventListener("pointermove", function(e){
      if (dragging) apply(e);
    });
    function endDrag(e){
      if (!dragging) return;
      dragging = false;
      el.classList.remove("dragging");
      if (opts.onEnd) opts.onEnd(ratioFromEvent(e));
    }
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", function(){
      dragging = false;
      el.classList.remove("dragging");
    });

    el.addEventListener("keydown", function(e){
      var step = opts.keyStep || 0.05;
      var cur = opts.get();
      var next = null;
      if (e.key === "ArrowRight" || e.key === "ArrowUp") next = Math.min(1, cur + step);
      else if (e.key === "ArrowLeft" || e.key === "ArrowDown") next = Math.max(0, cur - step);
      else if (e.key === "Home") next = 0;
      else if (e.key === "End") next = 1;
      if (next !== null){
        opts.onInput(next);
        if (opts.onEnd) opts.onEnd(next);
        e.preventDefault();
      }
    });
  }

  /* 进度滑块：拖拽定位（模拟跳转） */
  makeSlider($("seek"), {
    get: function(){
      return state.pos / songById(state.currentId).dur;
    },
    keyStep: 5 / 300,   /* 方向键约 ±5 秒 */
    onInput: function(r){
      if (!state.started){
        state.started = true;
        state.contextName = getView().name;
      }
      state.pos = r * songById(state.currentId).dur;
      renderSeek();
      renderPlayer();
    },
    onEnd: function(){ /* 模拟音频：位置即时生效 */ }
  });

  /* 音量滑块 */
  makeSlider($("volume"), {
    get: function(){ return state.volume / 100; },
    keyStep: 0.05,
    onInput: function(r){
      state.volume = Math.round(r * 100);
      if (state.volume > 0){
        state.muted = false;
        state.lastVolume = state.volume;
      }
      renderVolume();
      renderMute();
    }
  });

  /* ---------------- 事件绑定 ---------------- */

  /* 播放 / 暂停 */
  $("play-btn").addEventListener("click", togglePlay);

  /* 上一首 / 下一首 */
  $("prev-btn").addEventListener("click", function(){ skip(-1); });
  $("next-btn").addEventListener("click", function(){ skip(1); });

  /* 循环模式三态 */
  var LOOP_SEQ = ["order", "one", "shuffle"];
  var LOOP_NAME = { order:"顺序循环", one:"单曲循环", shuffle:"随机播放" };
  $("loop-btn").addEventListener("click", function(){
    var i = LOOP_SEQ.indexOf(state.loop);
    state.loop = LOOP_SEQ[(i + 1) % LOOP_SEQ.length];
    renderLoop();
    toast("循环模式：<b>" + LOOP_NAME[state.loop] + "</b>");
  });

  /* 收藏（播放器） */
  $("np-like").addEventListener("click", function(){
    toggleLike(state.currentId);
  });

  /* 静音切换 */
  $("mute-btn").addEventListener("click", function(){
    if (state.muted || state.volume === 0){
      state.muted = false;
      state.volume = state.lastVolume > 0 ? state.lastVolume : 40;
      toast("取消静音 · 音量 <b>" + state.volume + "</b>");
    } else {
      state.lastVolume = state.volume;
      state.muted = true;
      toast("已静音");
    }
    renderVolume();
    renderMute();
  });

  /* 收藏切换（列表行 + 同步播放器/侧栏） */
  function toggleLike(id){
    var s = songById(id);
    if (isLiked(id)){
      delete state.likes[id];
      toast("已将 <b>" + s.title + "</b> 移出我的收藏");
    } else {
      state.likes[id] = true;
      toast("已收藏 <b>" + s.title + "</b> 到我的收藏");
    }
    renderSidebar();
    renderList();
    renderPlayer();
  }

  /* 列表事件委托：点歌 / 行内收藏 */
  $("song-list").addEventListener("click", function(e){
    var likeBtn = e.target.closest("[data-like]");
    if (likeBtn){
      toggleLike(parseInt(likeBtn.getAttribute("data-like"), 10));
      return;
    }
    var mainBtn = e.target.closest(".row-main");
    if (mainBtn){
      var row = mainBtn.closest(".row");
      var id = parseInt(row.getAttribute("data-id"), 10);
      var view = getView();
      var ids = view.ids;
      if (state.query.trim()){
        ids = ids.filter(function(sid){
          var s = songById(sid);
          var q = state.query.trim().toLowerCase();
          return s.title.toLowerCase().indexOf(q) !== -1 ||
                 s.artist.toLowerCase().indexOf(q) !== -1;
        });
      }
      playSong(id, ids.length ? ids : ALL_IDS, view.name);
    }
  });

  /* 侧栏视图切换（事件委托） */
  document.querySelector(".sidebar").addEventListener("click", function(e){
    var item = e.target.closest("[data-view]");
    if (!item) return;
    state.view = item.getAttribute("data-view");
    renderSidebar();
    renderList();
  });

  /* 搜索过滤 */
  $("search-input").addEventListener("input", function(e){
    state.query = e.target.value;
    renderList();
  });

  /* 页面可见性：切走时校准计时基线，防止漂移 */
  document.addEventListener("visibilitychange", function(){
    lastTs = performance.now();
  });

  /* ---------------- 启动 ---------------- */
  renderAll();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
