/* ==========================================================================
   TTY 1984 · 终端手稿 —— 慢速缓存 Slow Cache
   方向B·标准风格：炫在皮肤、不炫在操作。所有交互都是最传统的网页方式。
   ========================================================================== */

/* ---------- 1. 设计令牌 ---------- */
:root {
  --bg:     #131318;   /* 屏幕底色·暖黑 */
  --panel:  #1B1B23;   /* 面板 / 代码块 */
  --fg:     #D9DCE3;   /* 主文字·暖白 */
  --acc:    #3DF08C;   /* 强调·磷光绿（命令/链接） */
  --amb:    #F0A868;   /* 次强调·琥珀（路径/数字） */
  --dim:    #6E7387;   /* 弱化·灰紫（注释/边框） */
  --sub:    #9BA1B3;   /* 次级文字（摘要/说明，保证对比度） */
  --line:   rgba(110,115,135,.26);
  --line2:  rgba(110,115,135,.38);
  --acc-ink:#0B0E12;   /* 反白时压在磷光绿上的深色 */
  --acc-soft: color-mix(in srgb, var(--acc) 6%, transparent);
  --acc-ring: color-mix(in srgb, var(--acc) 28%, transparent);
  --mono: "JetBrains Mono","Cascadia Code",Consolas,"Courier New","Noto Sans SC",monospace;
  --sans: "Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
/* 琥珀磷光主题：交换强调与次强调，其余不动 */
html[data-theme="amber"] {
  --acc: #F0A868;
  --amb: #3DF08C;
}

/* ---------- 2. 基础与全局 ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.7 var(--mono);
  min-height: 100vh;
  padding: 26px 18px 46px;
  /* 极淡的磷光辉光，营造 CRT 玻璃感（克制） */
  background-image:
    radial-gradient(1100px 620px at 50% -8%, var(--acc-soft), transparent 62%),
    radial-gradient(900px 560px at 50% 112%, color-mix(in srgb, var(--amb) 4%, transparent), transparent 60%);
  background-attachment: fixed;
}
::selection { background: var(--acc); color: var(--acc-ink); }
:focus-visible { outline: 1px dashed var(--acc); outline-offset: 2px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2A2A36; border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--acc); }

/* CRT 扫描线：全站 ≤3% 透明度，纯装饰、不参与交互 */
.crt {
  position: fixed; inset: 0; z-index: 210; pointer-events: none;
  background: repeating-linear-gradient(0deg,
    rgba(255,255,255,.028) 0 1px, transparent 1px 3px);
}

/* 阅读进度细线（仅文章视图显示） */
#prog {
  position: fixed; top: 0; left: 0; height: 2px; width: 0;
  background: var(--acc); z-index: 260; opacity: 0;
  box-shadow: 0 0 8px var(--acc-ring);
}
body.mode-post #prog { opacity: 1; }

/* ---------- 3. 终端窗口框 ---------- */
.win {
  max-width: 1240px; margin: 0 auto;
  background: var(--bg);
  border: 1px solid var(--line2);
  border-radius: 10px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.4),
    0 30px 90px rgba(0,0,0,.55),
    inset 0 0 140px rgba(0,0,0,.22);
}
/* 标题栏：macOS 红黄绿 + fake 路径栏 */
.tbar {
  display: flex; align-items: center; gap: 14px;
  height: 44px; padding: 0 14px;
  background: linear-gradient(180deg, #1E1E27, #171720);
  border-bottom: 1px solid var(--line2);
  position: relative;
}
.dots { display: flex; gap: 8px; flex: 0 0 auto; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.r { background: #FF5F56; } .dot.y { background: #FFBD2E; } .dot.g { background: #27C93F; }
.path {
  position: absolute; left: 50%; transform: translateX(-50%);
  color: var(--sub); font-size: 12.5px; white-space: nowrap;
  max-width: 46%; overflow: hidden; text-overflow: ellipsis;
}
.path b { color: var(--amb); font-weight: 500; }
.tbar-r { margin-left: auto; display: flex; gap: 8px; }

/* 通用幽灵按钮 */
.btn {
  font: 12.5px var(--mono);
  color: var(--acc); background: transparent;
  border: 1px solid var(--line); border-radius: 4px;
  padding: 4px 10px; cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
  white-space: nowrap;
}
.btn:hover { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.btn:disabled { opacity: .32; cursor: default; pointer-events: none; }

/* 导航栏 */
.nav {
  display: flex; align-items: center;
  padding: 0 14px; border-bottom: 1px solid var(--line2);
  overflow-x: auto; scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.brand {
  color: var(--fg); font-weight: 600; letter-spacing: .5px;
  padding: 11px 14px 11px 2px; white-space: nowrap; font-size: 14.5px;
  text-decoration: none;
}
.brand b { color: var(--acc); font-weight: 600; }
.brand span.en { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
.nav a {
  color: var(--sub); text-decoration: none; font-size: 13.5px;
  padding: 11px 13px; white-space: nowrap;
}
.nav a::before { content: "  "; white-space: pre; }
.nav a.on { color: var(--acc); }
.nav a.on::before { content: "▸"; margin-right: 6px; }
.nav a:hover { color: var(--fg); }
.nav-r { margin-left: auto; padding-left: 10px; }

/* 常驻命令行搜索条 */
.cmdrow {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--line2);
  background: rgba(27,27,35,.5);
}
.prompt { color: var(--sub); white-space: nowrap; font-size: 13.5px; }
.prompt .u { color: var(--amb); }
.prompt .h { color: var(--acc); }
#q {
  flex: 1; min-width: 0;
  background: transparent; border: none; outline: none;
  color: var(--fg); font: 14px var(--mono); caret-color: var(--acc);
}
#q::placeholder { color: var(--dim); }
.caret {
  width: 9px; height: 17px; background: var(--acc);
  display: inline-block; flex: 0 0 auto;
  animation: blink 1.1s steps(1) infinite;
}
.cmdrow:not(.idle) .caret { visibility: hidden; }
.hint { color: var(--dim); font-size: 11.5px; white-space: nowrap; }
@keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

/* 主内容区 */
main { padding: 18px 18px 24px; min-height: 430px; }
.cmd-echo { color: var(--dim); font-size: 13px; margin: 6px 0; }
.cmd-echo .pp { color: var(--amb); }
.cmd-echo .cm { color: var(--acc); }
.cmd-echo .note { color: var(--dim); }

/* ---------- 4. 首页：whoami + 文章表 ---------- */
.who { margin-bottom: 18px; }
.who-line {
  font-size: 14.5px; color: var(--fg);
  border-left: 2px solid var(--acc); padding: 2px 0 2px 12px;
  margin: 6px 0 14px;
}
.who-line b { color: var(--acc); }
.who-line i { color: var(--sub); font-style: normal; }

.home-grid { display: grid; grid-template-columns: minmax(0,1fr) 268px; gap: 24px; align-items: start; }

/* 分类 Tab：选中态变 [x] 分类 */
.ctabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.ctab {
  font: 12.5px var(--mono); color: var(--sub);
  background: transparent; border: 1px solid var(--line); border-radius: 3px;
  padding: 4px 9px; cursor: pointer;
  transition: color .12s, border-color .12s;
}
.ctab i { color: var(--dim); font-style: normal; margin-left: 5px; font-size: 11px; }
.ctab:hover { color: var(--fg); border-color: var(--sub); }
.ctab.on { color: var(--acc); border-color: var(--acc); background: var(--acc-soft); }
.ctab.on:hover { color: var(--acc); }

.grep-line { color: var(--dim); font-size: 12.5px; margin: 2px 0 8px; }
.grep-line b { color: var(--amb); font-weight: 500; }
.grep-line .clr {
  font: 12px var(--mono); color: var(--acc); background: none;
  border: 1px dashed var(--line); border-radius: 3px;
  padding: 1px 7px; cursor: pointer; margin-left: 8px;
}
.grep-line .clr:hover { color: var(--acc-ink); background: var(--acc); border-style: solid; }

/* 文章表格 */
.lhead {
  display: grid; grid-template-columns: 92px 84px 1fr 62px; gap: 12px;
  color: var(--dim); font-size: 11.5px;
  padding: 6px 10px; border-bottom: 1px solid var(--line2);
}
.row {
  border-bottom: 1px solid var(--line);
  padding: 13px 10px; cursor: pointer;
  transition: background .12s;
}
.row:hover, .row:focus-visible { background: var(--acc); }
.row:hover .r-date, .row:hover .r-cat, .row:hover .r-title, .row:hover .r-min,
.row:hover .r-sum, .row:hover .r-tags, .row:hover .sprout,
.row:focus-visible .r-date, .row:focus-visible .r-cat, .row:focus-visible .r-title,
.row:focus-visible .r-min, .row:focus-visible .r-sum, .row:focus-visible .r-tags {
  color: var(--acc-ink) !important;
}
.row-top { display: grid; grid-template-columns: 92px 84px 1fr 62px; gap: 12px; align-items: baseline; }
.r-date { color: var(--amb); font-size: 12.5px; white-space: nowrap; }
.r-cat { color: var(--acc); font-size: 12px; white-space: nowrap; }
.r-title { font-size: 15px; font-weight: 600; color: var(--fg); line-height: 1.55; }
.r-min { color: var(--dim); font-size: 11.5px; text-align: right; white-space: nowrap; }
.row-sub { display: flex; justify-content: space-between; gap: 18px; margin-top: 7px; align-items: baseline; }
.r-sum {
  color: var(--sub); font-size: 12.5px; line-height: 1.75; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.r-tags { color: var(--dim); font-size: 11.5px; white-space: nowrap; flex: 0 0 auto; }
.sprout { font-size: 12.5px; }

.pager { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 18px; color: var(--sub); font-size: 12.5px; }
.pager b { color: var(--amb); font-weight: 500; }

.empty {
  border: 1px dashed var(--line2); border-radius: 6px;
  padding: 30px 16px; text-align: center; color: var(--sub);
  font-size: 13.5px; margin: 16px 0;
}
.empty b { color: var(--amb); font-weight: 500; }
.empty .btn { margin-top: 12px; }

/* ---------- 5. 侧栏面板 ---------- */
.side { position: sticky; top: 18px; }
.panel { border: 1px solid var(--line2); border-radius: 6px; margin-bottom: 16px; background: rgba(27,27,35,.45); overflow: hidden; }
.panel-h { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--acc); font-size: 12.5px; background: var(--acc-soft); }
.panel-b { padding: 12px; }
.panel-b p { font-size: 12.5px; color: var(--sub); line-height: 1.8; }
.panel-b .more { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--acc); text-decoration: none; }
.panel-b .more:hover { text-decoration: underline; }
.tagcloud { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  font: 12px var(--mono); color: var(--sub);
  background: transparent; border: 1px dashed var(--line); border-radius: 3px;
  padding: 3px 8px; cursor: pointer;
  transition: color .12s, border-color .12s;
}
.tag i { color: var(--dim); font-style: normal; font-size: 10.5px; margin-left: 4px; }
.tag:hover { color: var(--acc); border-color: var(--acc); }

/* 表单（订阅 / 留言板共用） */
.fld { margin-bottom: 10px; }
.fld label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
.fld label em { color: var(--amb); font-style: normal; }
.fld input, .fld textarea {
  width: 100%;
  background: #14141B; border: 1px solid var(--line); border-radius: 4px;
  color: var(--fg); font: 13px var(--mono); padding: 8px 10px;
  caret-color: var(--acc);
}
.fld textarea { resize: vertical; min-height: 88px; }
.fld input:focus, .fld textarea:focus {
  outline: none; border-color: var(--acc);
  box-shadow: 0 0 0 1px var(--acc-ring);
}
.fld .err { display: none; color: var(--amb); font-size: 11.5px; margin-top: 4px; }
.fld .err::before { content: "! "; }
.fld.bad input, .fld.bad textarea { border-color: var(--amb); }
.fld.bad .err { display: block; }
.form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.sub-row { display: flex; gap: 8px; }
.sub-row input { flex: 1; min-width: 0; }
.form-msg { font-size: 12px; margin-top: 8px; color: var(--amb); }
.form-msg.ok { color: var(--acc); }
.form-msg.ok::before { content: "✓ "; }

/* ---------- 6. 文章页 ---------- */
.post-grid { display: grid; grid-template-columns: minmax(0,1fr) 218px; gap: 30px; align-items: start; }
.fm {
  border: 1px solid var(--line2); border-radius: 6px;
  background: rgba(27,27,35,.5); padding: 12px 16px;
  font-size: 13px; margin: 10px 0 6px;
}
.fm div { display: flex; gap: 10px; padding: 2.5px 0; flex-wrap: wrap; }
.fm .k { color: var(--dim); flex: 0 0 86px; }
.fm .v { color: var(--fg); flex: 1; min-width: 0; }
.fm .v.cat { color: var(--amb); }
.fm .v.tags a { color: var(--acc); text-decoration: none; margin-right: 8px; }
.fm .v.tags a:hover { text-decoration: underline; }
.fm .v.muted { color: var(--sub); }

.prose {
  max-width: 72ch;
  font-family: var(--sans);
  font-size: 16px; line-height: 1.95;
  padding-top: 12px;
}
.prose h1 {
  font-size: 24px; line-height: 1.5; margin: 14px 0 10px;
  font-weight: 700; scroll-margin-top: 60px;
}
.prose h1::before { content: "# "; color: var(--acc); font: 700 19px var(--mono); }
.prose h2 {
  font-size: 19px; margin: 36px 0 14px; padding-bottom: 8px;
  border-bottom: 1px solid var(--line2); scroll-margin-top: 60px;
}
.prose h2::before { content: "## "; color: var(--acc); font: 600 14px var(--mono); }
.prose h3 { font-size: 16.5px; margin: 26px 0 10px; scroll-margin-top: 60px; }
.prose h3::before { content: "### "; color: var(--dim); font: 600 12.5px var(--mono); }
.prose p { margin: 0 0 16px; }
.prose strong { color: var(--amb); font-weight: 600; }
.prose ul { margin: 0 0 16px; list-style: none; }
.prose li { margin: 0 0 9px; padding-left: 20px; position: relative; }
.prose li::before { content: "▸"; color: var(--acc); position: absolute; left: 2px; top: 4px; font: 12px var(--mono); }
.prose code {
  font: .84em var(--mono);
  background: rgba(27,27,35,.92);
  border: 1px solid var(--line); border-radius: 3px;
  padding: 1px 6px; color: var(--acc);
  word-break: break-all;
}
.prose blockquote {
  margin: 22px 0; padding: 13px 18px;
  border-left: 2px solid var(--acc);
  background: var(--acc-soft);
  color: var(--sub); font-size: 15px;
}
.prose blockquote::before { content: "» "; color: var(--acc); font-family: var(--mono); }

/* 代码块：行号 + 复制按钮 + 轻语法着色 */
.codeblock { margin: 20px 0; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; background: var(--panel); }
.cb-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px 6px 12px;
  border-bottom: 1px solid var(--line); background: rgba(0,0,0,.28);
}
.cb-lang { color: var(--amb); font: 12px var(--mono); }
.cb-lang::before { content: "◈ "; color: var(--dim); }
.cb-copy {
  font: 11.5px var(--mono); color: var(--acc);
  background: transparent; border: 1px solid var(--line); border-radius: 3px;
  padding: 2px 9px; cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.cb-copy:hover { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.codeblock pre { overflow-x: auto; padding: 13px 0; font: 13px/1.8 var(--mono); }
.cl { display: flex; }
.ln { flex: 0 0 46px; text-align: right; padding-right: 15px; color: var(--dim); opacity: .65; user-select: none; }
.lc { flex: 1; padding-right: 16px; white-space: pre; color: var(--fg); }
.tk-k { color: var(--acc); }
.tk-s { color: var(--amb); }
.tk-c { color: var(--dim); font-style: italic; }
.tk-n { color: var(--amb); }

/* 桌面目录 TOC */
.toc-d {
  position: sticky; top: 18px;
  border-left: 1px solid var(--line2);
  padding: 2px 0 2px 14px;
  font-size: 12.5px; max-height: 72vh; overflow: auto;
}
.toc-h { color: var(--dim); font-size: 11.5px; margin-bottom: 8px; }
.toc-h::before { content: "$ "; color: var(--acc); }
.toc-d a {
  display: block; color: var(--sub); text-decoration: none;
  padding: 3px 0; line-height: 1.55;
}
.toc-d a.lv3 { padding-left: 13px; }
.toc-d a:hover { color: var(--fg); }
.toc-d a.on { color: var(--acc); }
.toc-d a.on::before { content: "▸ "; }

/* 移动端折叠目录 */
.toc-m { display: none; margin: 4px 0 18px; border: 1px solid var(--line2); border-radius: 6px; }
.toc-m summary { padding: 9px 13px; color: var(--acc); cursor: pointer; font-size: 13px; }
.toc-m summary::marker { content: none; }
.toc-m summary::before { content: "$ cat toc.txt"; }
.toc-m a { display: block; color: var(--sub); text-decoration: none; padding: 7px 15px; border-top: 1px solid var(--line); font-size: 13px; }
.toc-m a:hover { color: var(--acc); }

/* 上一篇 / 下一篇 + 相关文章 */
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 40px 0 6px; max-width: 72ch; }
.pn a {
  border: 1px solid var(--line2); border-radius: 6px;
  padding: 11px 15px; text-decoration: none; color: var(--sub); font-size: 12.5px;
  transition: border-color .12s;
}
.pn a:hover { border-color: var(--acc); }
.pn a.nx { text-align: right; }
.pn .lab { color: var(--dim); font-size: 11px; }
.pn b { display: block; color: var(--acc); font-size: 13.5px; margin-top: 5px; font-weight: 600; line-height: 1.55; }
.rel { margin: 20px 0 0; max-width: 72ch; }
.rel a {
  display: block; color: var(--sub); text-decoration: none; font-size: 13px;
  padding: 7px 4px; border-bottom: 1px dashed var(--line);
}
.rel a::before { content: "-rw-r--r--  "; color: var(--dim); font-size: 11px; }
.rel a b { color: var(--fg); font-weight: 500; }
.rel a:hover { color: var(--acc); }
.rel a:hover b { color: var(--acc); }

/* ---------- 7. 归档 ---------- */
.year { margin-bottom: 20px; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
.year > summary {
  cursor: pointer; list-style: none;
  padding: 10px 14px; font-size: 15.5px; color: var(--acc);
  background: var(--acc-soft);
  display: flex; align-items: baseline; gap: 10px;
}
.year > summary::-webkit-details-marker { display: none; }
.year > summary::before { content: "▸"; color: var(--dim); transition: transform .15s; }
.year[open] > summary::before { content: "▾"; }
.year-c { color: var(--dim); font-size: 12px; }
.arow {
  display: flex; gap: 16px; padding: 10px 14px; align-items: baseline;
  border-top: 1px solid var(--line); cursor: pointer;
  transition: background .12s;
}
.arow:hover { background: var(--acc); }
.arow:hover .a-date, .arow:hover .a-title, .arow:hover .a-cat, .arow:hover .a-min { color: var(--acc-ink) !important; }
.a-date { color: var(--amb); font-size: 12.5px; flex: 0 0 92px; }
.a-title { color: var(--fg); font-size: 14px; font-weight: 500; flex: 1; font-family: var(--sans); }
.a-cat { color: var(--acc); font-size: 12px; flex: 0 0 auto; }
.a-min { color: var(--dim); font-size: 11.5px; flex: 0 0 52px; text-align: right; }

  sprout: "",
  body: `<p>那天凌晨一点，我盯着 Lighthouse 报告上刺眼的 <strong>45 分</strong>，顺手把「性能优化」写在便利贴上，贴在了仙人掌的花盆边上。三个月后的今天，这个博客的首屏时间是 <strong>296ms</strong>（本地模拟 Moto G4 节流），性能分 <strong>98</strong>。这篇是完整的考古记录：挖出来了什么，又主动埋回去了什么。</p>
<blockquote>性能预算只有一条：读者点开链接之后，第一个字出现的时间，必须快过他移开视线的速度。</blockquote>

<p>先把验尸报告摊开。45 分的构成非常经典：</p>

<h2 id="p2">二、字体：最大的那块石头</h2>
<p>中文 webfont 的体积问题是结构性的：一个字重随随便便 3–8MB。解法不是换字体，而是<strong>子集化 + swap</strong>。我只保留站点固定文案用到的约 1,400 字加常用字表，切出 82KB 的 woff2，再声明区段按需加载：</p>

<pre data-code="perfJs"></pre>

<p>把首页真正用到的样式手工挑出来（不是跑工具猜），内联进文档头部；剩下的整包用 <code>media="print"</code> 的老技巧异步加载，不阻塞首次渲染：</p>
<pre data-code="perfCss"></pre>
<p>这一步没有任何黑魔法，只有纪律：新写的组件必须先过一遍「这个选择器，首屏真的用得到吗」。</p>

<p>题图全部转 WebP，2x 分辨率控制在 90KB 以内。更重要的是给每张图声明宽高——CLS 从 0.31 降到 0.01，靠的不是懒加载，而是浏览器提前知道这里将有一块多大的地方：</p>

  body: `<p>把三个拿奖的滚动叙事网站以 0.25 倍速逐帧拉了一遍（共六个小时），把它们的动效节奏拆成了可以复用的法则。这篇是笔记的整理版。</p>

  sprout: "",
  body: `<p>过去两年，杂志感的衬线排版在屏幕上大规模回潮：独立杂志上线、博客换宋体、连银行 app 的年度财报都开始用衬线标题。这场回潮不是审美的轮回，而是技术的还债——<strong>屏幕终于配得上衬线体了</strong>。</p>

  sprout: "",
  body: `<p>今年一月，我给自己出了道题：<strong>只用 Node 标准库，写一个能养活这个博客的静态站点生成器</strong>。没有 npm install，没有依赖树，没有安全公告邮件。90 天后，这个站点跑起来了，构建脚本一共 640 行。这篇是完整的架构复盘。</p>
<h2 id="s1">一、为什么不用现成的</h2>
<p>Hugo 快，Astro 现代，Hexo 生态成熟。但我想要三样它们给不了的东西：</p>

/* ---------- 轻量语法着色（注释/字符串/关键字/数字） ---------- */
function hlLine(line, lang) {
  let s = esc(line);
  const stash = [];
  const keep = (html) => { stash.push(html); return "\uE000" + String.fromCharCode(0xE101 + stash.length - 1) + "\uE001"; };
  /* 1. 字符串 */
  s = s.replace(/("[^"]*"|'[^']*')/g, m => keep('<span class="tk-s">' + m + "</span>"));
  /* 2. 注释 */
  const cm = {
    js: /\/\/.*$/, css: /\/\*.*?\*\//, bash: /#.*$/, yaml: /#.*$/, html: /&lt;!--.*?--&gt;/,
    txt: null
  }[lang];
  if (cm) s = s.replace(cm, m => keep('<span class="tk-c">' + m + "</span>"));
  /* 3. 关键字 */
  const kws = {
    js: "\\b(const|let|var|function|return|if|else|for|while|new|class|import|export|from|await|async|of|in|typeof|require|true|false|null|this)\\b",
    bash: "\\b(if|then|else|fi|set|env|curl|scp|ssh|python3|kindlegen|date|echo|local)\\b",
    css: "(@font-face|@media|@supports|:root|unicode-range|font-display|font-family|format)",
    html: null, txt: null
  }[lang];
  if (kws) {
    const re = lang === "css" ? new RegExp(kws, "g") : new RegExp(kws, "g");
    s = s.replace(re, '<span class="tk-k">$1</span>');
  }
  /* 4. 十六进制色值暂存（避免 #FFF 里的数字被误染），再标数字 */
  s = s.replace(/#[0-9A-Fa-f]{3,8}\b/g, m => keep(m));
  s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tk-n">$1</span>');
  /* 5. 还原被暂存的字符串、注释与色值 */
  s = s.replace(/\uE000([\uE101-\uE140])\uE001/g, (m, c) => stash[c.charCodeAt(0) - 0xE101]);
  return s;
}

/* 把 <pre data-code> 增强为带行号/复制按钮的代码块 */
function enhanceCode(root) {
  $$('pre[data-code]', root).forEach(pre => {
    const sample = CODE[pre.dataset.code];
    if (!sample) { pre.remove(); return; }
    const lines = sample.code.split("\n");
    const rows = lines.map((ln, i) =>
      '<span class="cl"><span class="ln">' + (i + 1) + '</span><span class="lc">' +
      (hlLine(ln, sample.lang) || "") + "</span></span>").join("\n");
    const box = document.createElement("div");
    box.className = "codeblock";
    box.innerHTML =
      '<div class="cb-head"><span class="cb-lang">' + esc(sample.lang) +
      '</span><button class="cb-copy" type="button">$ copy</button></div>' +
      "<pre><code>" + rows + "</code></pre>";
    pre.replaceWith(box);
  });
}

function copyText(text, btn) {
  const done = () => {
    if (!btn) return;
    const old = btn.textContent;
    btn.textContent = "✓ copied"; btn.classList.add("ok");
    setTimeout(() => { btn.textContent = old; btn.classList.remove("ok"); }, 1600);
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { if (btn) btn.textContent = "✗ 失败"; }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
}

/* ---------- 筛选与查询 ---------- */
function parseQuery(q) {
  q = q.trim();
  let m = q.match(/^tag[:：]\s*(\S+)$/); if (m) return { type: "tag", v: m[1] };
  m = q.match(/^cat[:：]\s*(\S+)$/); if (m) return { type: "cat", v: m[1] };
  return { type: "text", v: q };
}
function filteredPosts() {
  let list = POSTS.slice();
  if (state.cat !== "全部") list = list.filter(p => p.cat === state.cat);
  if (state.tag) list = list.filter(p => p.tags.some(t => t.indexOf(state.tag) !== -1));
  const q = parseQuery(state.q);
  if (q.v) {
    if (q.type === "tag") list = list.filter(p => p.tags.some(t => t.indexOf(q.v) !== -1));
    else if (q.type === "cat") list = list.filter(p => p.cat.indexOf(q.v) !== -1);
    else list = list.filter(p => (p.title + p.sum + p.tags.join("") + p.cat).indexOf(q.v) !== -1);
  }
  return list;
}

            rel.map(x => '<a href="#/post/' + x.id + '"><b>' + esc(x.title) + "</b> · " + x.date + "</a>").join("") + "</div>" : "") +
        "</div>" +
        '<aside class="toc-d" id="tocDesk"><div class="toc-h">cat toc.txt</div><nav id="tocNav"></nav></aside>' +
      "</div>" +
    "</div>";

  enhanceCode(els.main);
  buildToc();
}

function buildToc() {
  const hs = $$(".prose h2[id], .prose h3[id]", els.main);
  const nav = $("#tocNav");
  const mob = $("#tocMobile");
  if (!hs.length) { if (nav) nav.closest(".toc-d").style.display = "none"; if (mob) mob.style.display = "none"; return; }
  const items = hs.map(h =>
    '<a data-scroll="' + h.id + '" class="' + (h.tagName === "H3" ? "lv3" : "lv2") + '" href="#' + h.id + '">' + esc(h.textContent) + "</a>").join("");
  if (nav) nav.innerHTML = items;
  if (mob) mob.innerHTML = "<summary></summary>" + items;
  if (tocIO) tocIO.disconnect();
  tocIO = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        $$("#tocNav a, #tocMobile a").forEach(a => a.classList.toggle("on", a.dataset.scroll === en.target.id));
      }
    });
  }, { rootMargin: "-60px 0px -66% 0px" });
  hs.forEach(h => tocIO.observe(h));
}

/* ---------- 路由 ---------- */
function router() {
  const h = location.hash || "#/home";
  closeHelp();
  els.main.dataset.view = "";
  if (h.indexOf("#/post/") === 0) {
    state.view = "post"; state.postId = h.slice(7);
    document.body.classList.add("mode-post");
    renderPost(state.postId);
    els.path.innerHTML = "<b>~/posts/" + esc(state.postId) + ".md</b>";
    document.title = (POSTS.find(p => p.id === state.postId) || { title: "未找到" }).title + " · 慢速缓存";
  } else {
    document.body.classList.remove("mode-post");
    els.prog.style.width = "0";
    if (h === "#/archive") { state.view = "archive"; renderArchive(); els.path.innerHTML = "<b>~/archive</b>"; document.title = "归档 · 慢速缓存"; }
    else if (h === "#/guestbook") { state.view = "guestbook"; renderGuestbook(false); els.path.innerHTML = "<b>~/guestbook</b>"; document.title = "留言板 · 慢速缓存"; }
    else if (h === "#/about") { state.view = "about"; renderAbout(); els.path.innerHTML = "<b>~/about</b>"; document.title = "关于 · 慢速缓存"; }
    else { state.view = "home"; renderHome(); els.path.innerHTML = "<b>~</b>"; document.title = "慢速缓存 · Slow Cache — shen@slowcache-dev"; }
    window.scrollTo({ top: 0, behavior: "auto" });
  }
  $$(".nav a[data-nav]").forEach(a => {
    a.classList.toggle("on", a.dataset.nav === (state.view === "post" ? "home" : state.view));
  });
  updateStatus();
}

function updateStatus() {
  let left = "文章 " + POSTS.length + " · 约 " + fmtWords(TOTAL_WORDS) + " 字";
  if (state.view === "home") {
    const n = filteredPosts().length;
    left += " · 匹配 " + n + "/" + POSTS.length;
  } else if (state.view === "guestbook") {
    left += " · 留言 " + loadGuestbook().length + " 条";
  }
  els.statL.textContent = left;
}

/* ---------- Boot 开机序列 ---------- */
const BOOT_LINES = [
  { t: "SLOWCACHE BIOS v3.2.1 · 内存自检 65536 KB ............ OK", c: "dim" },
  { t: "显示设备：CRT · P1 磷光绿 ............................. OK", c: "dim" },
  { t: "$ mount /dev/blog ~ ... OK（灵魂只读，生活可写）", c: "cmd" },
  { t: "$ source /etc/motto", c: "cmd" },
  { t: "  → 把值得想的事，写在会呼吸的页面上。", c: "motto" },
  { t: "$ ssh guest@slowcache.dev ..... 连接建立 · 欢迎来访", c: "cmd" },
  { t: "载入索引：" + POSTS.length + " 篇文章 · 3 个年度 ............. 完毕", c: "dim" }
];
let bootTimers = [], bootOn = false;
function playBoot(force) {
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!force && (store.get("sc_boot") || reduced)) { els.boot.classList.add("hide"); return; }
  bootOn = true;
  els.boot.classList.remove("off", "hide");
  els.bootLines.innerHTML = "";
  BOOT_LINES.forEach((ln, i) => {
    bootTimers.push(setTimeout(() => {
      const d = document.createElement("div");
      d.className = "bl " + (ln.c || "");
      d.textContent = ln.t;
      els.bootLines.appendChild(d);
    }, 160 + i * 170));
  });
  bootTimers.push(setTimeout(closeBoot, 160 + BOOT_LINES.length * 170 + 620));
}
function closeBoot() {
  if (!bootOn) return;
  bootOn = false;
  bootTimers.forEach(clearTimeout); bootTimers = [];
  store.set("sc_boot", "1");
  els.boot.classList.add("off");
  setTimeout(() => els.boot.classList.add("hide"), 480);
}
els.boot.addEventListener("pointerdown", closeBoot);

/* ---------- 快捷键帮助 ---------- */
function openHelp() { els.help.classList.remove("hide"); }
function closeHelp() { els.help.classList.add("hide"); }
function toggleHelp() { els.help.classList.toggle("hide"); }

/* ---------- 全局键盘 ---------- */
document.addEventListener("keydown", (e) => {
  if (bootOn) { closeBoot(); return; }
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA");
  if (e.key === "Escape") {
    if (!els.help.classList.contains("hide")) closeHelp();
    else if (typing && ae) ae.blur();
    else if (state.view === "post") location.hash = "#/home";
    return;
  }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); els.q.focus(); return; }
  if (e.key === "?") { e.preventDefault(); toggleHelp(); return; }
  if (e.key === "t" || e.key === "T") { toggleTheme(); return; }
  if (e.key === "g" || e.key === "G") { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (e.key === "j") { window.scrollBy({ top: 190, behavior: "smooth" }); return; }
  if (e.key === "k") { window.scrollBy({ top: -190, behavior: "smooth" }); return; }
  if (e.key === "Enter") {
    const row = ae && ae.classList && ae.classList.contains("row") ? ae :
                (ae && ae.classList && ae.classList.contains("arow") ? ae : null);
    if (row) { location.hash = "#/post/" + row.dataset.post; }
  }
});

/* ---------- 主区事件委托 ---------- */
els.main.addEventListener("click", (e) => {
  const copy = e.target.closest(".cb-copy");
  if (copy) {
    const block = copy.closest(".codeblock");
    const text = $$(".lc", block).map(x => x.textContent).join("\n");
    copyText(text, copy);
    return;
  }
  const scroll = e.target.closest("[data-scroll]");
  if (scroll) {
    e.preventDefault();
    const t = document.getElementById(scroll.dataset.scroll);
    if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const tag = e.target.closest("[data-tag]");
  if (tag) {
    state.tag = tag.dataset.tag; state.cat = "全部"; state.page = 1; state.q = ""; els.q.value = "";
    if (state.view !== "home") location.hash = "#/home";
    else { renderHome(); updateStatus(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    return;
  }
  const cat = e.target.closest("[data-cat]");
  if (cat) {
    state.cat = cat.dataset.cat; state.page = 1;
    renderHome(); updateStatus(); window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const clr = e.target.closest("[data-clear]");
  if (clr) {
    state.cat = "全部"; state.tag = null; state.q = ""; state.page = 1; els.q.value = "";
    renderHome(); updateStatus();
    return;
  }
  const pg = e.target.closest("[data-page]");
  if (pg) {
    const list = filteredPosts();
    const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    state.page = pg.dataset.page === "prev" ? Math.max(1, state.page - 1)
               : pg.dataset.page === "next" ? Math.min(pages, state.page + 1)
               : parseInt(pg.dataset.page, 10) || state.page;
    renderHome(); updateStatus(); window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const row = e.target.closest("[data-post]");
  if (row) { location.hash = "#/post/" + row.dataset.post; }
});

/* ---------- 表单：订阅 + 留言板 ---------- */
els.main.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "subForm") {
    const v = $("#subMail").value.trim();
    const msg = $("#subMsg");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
      msg.className = "form-msg"; msg.textContent = "邮箱格式看起来不太对，再检查一下？";
      return;
    }
    msg.className = "form-msg ok";
    msg.textContent = "subscribed · 已缓存（演示环境不会真的发信，但心意收到了）";
    $("#subMail").value = "";
    return;
  }
  if (e.target.id === "gbForm") {
    const fN = $("#fN"), fM = $("#fM"), fT = $("#fT");
    const n = $("#gbName").value.trim();
    const m = $("#gbMail").value.trim();
    const t = $("#gbText").value.trim();
    let ok = true;
    fN.classList.toggle("bad", !n); if (!n) ok = false;
    const mailBad = m && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m);
    fM.classList.toggle("bad", !!mailBad); if (mailBad) ok = false;
    fT.classList.toggle("bad", t.length < 5); if (t.length < 5) ok = false;
    if (!ok) return;
    const saved = (() => { try { return JSON.parse(store.get("sc_guestbook") || "[]"); } catch (x) { return []; } })();
    saved.unshift({ n: n, m: m, d: new Date().toISOString().slice(0, 10), t: t });
    store.set("sc_guestbook", JSON.stringify(saved.slice(0, 50)));
    renderGuestbook(true);
    updateStatus();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

/* ---------- 命令行搜索 ---------- */
els.q.addEventListener("input", () => {
  state.q = els.q.value; state.page = 1;
  els.cmdrow.classList.toggle("idle", !els.q.value);
  if (state.view !== "home") { location.hash = "#/home"; }
  else { renderHome(); updateStatus(); }
});
els.q.addEventListener("focus", () => els.cmdrow.classList.remove("idle"));
els.q.addEventListener("blur", () => els.cmdrow.classList.toggle("idle", !els.q.value));

/* ---------- 阅读进度 ---------- */
window.addEventListener("scroll", () => {
  if (state.view !== "post") { els.prog.style.width = "0"; return; }
  const art = $(".post-main", els.main);
  if (!art) return;
  const start = art.offsetTop - 90;
  const total = art.offsetHeight - window.innerHeight + 260;
  const p = Math.min(1, Math.max(0, (window.scrollY - start) / Math.max(1, total)));
  els.prog.style.width = (p * 100).toFixed(1) + "%";
}, { passive: true });

/* ---------- 状态栏 / 标题栏按钮 ---------- */
$("#themeBtn").addEventListener("click", toggleTheme);
$("#themeBtn2").addEventListener("click", toggleTheme);
$("#helpBtn").addEventListener("click", toggleHelp);
$("#helpBtn2").addEventListener("click", toggleHelp);
$("#helpClose").addEventListener("click", closeHelp);
els.help.addEventListener("click", (e) => { if (e.target === els.help) closeHelp(); });
$("#topBtn").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
$("#rebootBtn").addEventListener("click", () => { store.del("sc_boot"); playBoot(true); });
$("#rssBtn").addEventListener("click", (e) => copyText(FEED_URL, e.currentTarget));

/* ---------- 启动 ---------- */
(function init() {
  const savedTheme = store.get("sc_theme");
  setTheme(savedTheme === "amber" ? "amber" : "green");
  $("#uptimeTxt").textContent = UPTIME_DAYS + " 天";
  router();
  playBoot(false);
})();
