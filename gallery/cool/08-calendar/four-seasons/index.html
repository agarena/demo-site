<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="拾光历 · 四季流转 —— 春落樱、夏流萤、秋飞叶、冬飘雪的全屏季节粒子沉浸日历，2026 年节假日 / 节气 / 农历节日一览。">
<meta name="theme-color" content="#FFF0F5">
<title>拾光历 · 四季流转 | 2026 沉浸式季节日历</title>
<style>
/* ==========================================================
   拾光历 · 四季流转（方向D · 炫酷方向）
   全屏季节氛围粒子 + 玻璃拟态悬浮月历
   配色与布局依据调研文档：春樱粉 / 夏夜流萤 / 秋叶橙 / 冬雪蓝白
   ========================================================== */

/* ---------- 1. 基础重置与主题变量 ---------- */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --radius-l: 24px;
  --radius-m: 14px;
  --radius-s: 9px;
  --font-main: "Outfit", "Noto Sans SC", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-term: "ZCOOL XiaoWei", "Noto Serif SC", "STZhongsong", "SimSun", serif;
  --shadow-soft: 0 18px 50px rgba(40, 30, 50, 0.16);
  --shadow-deep: 0 30px 80px rgba(40, 30, 50, 0.22);
  --ease-out: cubic-bezier(0.22, 0.7, 0.25, 1);
}

/* 四季主题：随 viewed month 切换（JS 写入 body[data-season]） */
body[data-season="spring"] {
  --bg-solid: #FFF0F5;
  --glow-a: rgba(248, 187, 208, 0.55);
  --glow-b: rgba(214, 51, 108, 0.14);
  --primary: #D6336C;
  --primary-soft: rgba(214, 51, 108, 0.14);
  --particle: #F8BBD0;
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-brd: rgba(255, 255, 255, 0.78);
  --hover: rgba(255, 255, 255, 0.62);
  --ink: #46333C;
  --ink-2: #96788A;
  --term-color: #C2255C;
}
body[data-season="summer"] {
  --bg-solid: #0F2027;
  --glow-a: rgba(105, 219, 124, 0.16);
  --glow-b: rgba(255, 224, 102, 0.10);
  --primary: #FFE066;
  --primary-soft: rgba(255, 224, 102, 0.14);
  --particle: #FFE066;
  --glass-bg: rgba(16, 34, 34, 0.52);
  --glass-brd: rgba(180, 235, 205, 0.22);
  --hover: rgba(160, 235, 190, 0.12);
  --ink: #EAF6EE;
  --ink-2: #9DBBAA;
  --term-color: #8CE99A;
  color-scheme: dark;
}
body[data-season="autumn"] {
  --bg-solid: #FFF4E6;
  --glow-a: rgba(240, 140, 0, 0.30);
  --glow-b: rgba(201, 42, 42, 0.12);
  --primary: #E8590C;
  --primary-soft: rgba(232, 89, 12, 0.14);
  --particle: #F08C00;
  --glass-bg: rgba(255, 251, 243, 0.58);
  --glass-brd: rgba(255, 255, 255, 0.8);
  --hover: rgba(255, 250, 240, 0.75);
  --ink: #4A3423;
  --ink-2: #A08060;
  --term-color: #D9480F;
}
body[data-season="winter"] {
  --bg-solid: #F1F5FB;
  --glow-a: rgba(116, 192, 252, 0.34);
  --glow-b: rgba(25, 113, 194, 0.10);
  --primary: #1971C2;
  --primary-soft: rgba(25, 113, 194, 0.12);
  --particle: #74C0FC;
  --glass-bg: rgba(255, 255, 255, 0.60);
  --glass-brd: rgba(255, 255, 255, 0.85);
  --hover: rgba(255, 255, 255, 0.78);
  --ink: #33404E;
  --ink-2: #7B8CA1;
  --term-color: #1864AB;
}
/* 夜空模式：18:00 后或手动切换，叠加极光 */
body.night {
  --bg-solid: #0B1026;
  --glow-a: rgba(94, 234, 212, 0.12);
  --glow-b: rgba(132, 94, 247, 0.14);
  --glass-bg: rgba(14, 20, 40, 0.55);
  --glass-brd: rgba(150, 180, 255, 0.18);
  --hover: rgba(120, 160, 255, 0.12);
  --ink: #E8EEFF;
  --ink-2: #92A1C6;
  color-scheme: dark;
}
body.night[data-season="spring"] { --primary: #F783AC; --primary-soft: rgba(247, 131, 172, 0.16); }
body.night[data-season="autumn"] { --primary: #FFA94D; --primary-soft: rgba(255, 169, 77, 0.16); }
body.night[data-season="winter"] { --primary: #74C0FC; --primary-soft: rgba(116, 192, 252, 0.16); }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-main);
  color: var(--ink);
  background-color: var(--bg-solid);
  transition: background-color 1.2s ease, color 0.8s ease;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 2. 背景层：色晕 / 暗角 / 粒子画布 ---------- */
.haze {
  position: fixed;
  inset: -12%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(58% 46% at 18% 8%, var(--glow-a), transparent 62%),
    radial-gradient(52% 42% at 86% 88%, var(--glow-b), transparent 60%);
  transition: opacity 0.9s ease;
  will-change: transform;
  animation: hazeDrift 26s ease-in-out infinite alternate;
}
@keyframes hazeDrift {
  from { transform: translate3d(-1.5%, -1%, 0) scale(1); }
  to   { transform: translate3d(1.8%, 1.4%, 0) scale(1.05); }
}
.vignette {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(120% 90% at 50% 40%, transparent 58%, rgba(20, 12, 24, 0.20) 100%);
}
#fx {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none; /* 粒子不响应指针，避免干扰点击 */
}

/* ---------- 3. 顶部导航与时钟 ---------- */
.topbar {
  position: relative;
  z-index: 6;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 18px;
  max-width: 1360px;
  margin: 0 auto;
  padding: 18px clamp(14px, 3vw, 34px) 6px;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 12px;
  user-select: none;
}
.brand .logo-dot {
  width: 14px;
  height: 14px;
  border-radius: 50% 50% 50% 4px;
  background: linear-gradient(135deg, var(--primary), var(--particle));
  align-self: center;
  box-shadow: 0 0 14px var(--primary);
  transition: background 0.8s ease;
}
.brand h1 {
  font-size: 22px;
  letter-spacing: 4px;
  font-weight: 700;
}
.brand small {
  font-size: 12px;
  color: var(--ink-2);
  letter-spacing: 2px;
}
.clock-wrap {
  text-align: center;
  user-select: none;
}
.clock {
  font-size: clamp(24px, 3vw, 34px);
  font-weight: 600;
  letter-spacing: 3px;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  text-shadow: 0 2px 14px var(--primary-soft);
}
.date-line {
  margin-top: 3px;
  font-size: 12.5px;
  color: var(--ink-2);
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}
.date-line b {
  color: var(--term-color);
  font-weight: 600;
}
.nav {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.btn {
  appearance: none;
  border: 1px solid var(--glass-brd);
  background: var(--glass-bg);
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 1px;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: transform 0.22s var(--ease-out), box-shadow 0.22s ease, background 0.35s ease, color 0.35s ease, opacity 0.3s ease;
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 22px var(--primary-soft);
}
.btn:active { transform: translateY(0) scale(0.96); }
.btn:disabled { opacity: 0.35; cursor: default; transform: none; box-shadow: none; }
.btn-today {
  background: var(--primary);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
}
body.night .btn-today { color: #10131f; }
.btn-arrow {
  width: 38px;
  height: 38px;
  padding: 0;
  font-size: 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.month-label {
  min-width: 118px;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 2px;
  font-variant-numeric: tabular-nums;
  padding: 8px 6px;
}
.season-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 13px;
  border-radius: 999px;
  font-size: 12.5px;
  letter-spacing: 2px;
  border: 1px solid var(--glass-brd);
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  user-select: none;
}
.season-chip i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 10px var(--primary);
}

/* ---------- 4. 主舞台布局 ---------- */
.stage {
  position: relative;
  z-index: 5;
  max-width: 1360px;
  margin: 0 auto;
  padding: 12px clamp(14px, 3vw, 34px) 8px;
  display: grid;
  grid-template-columns: 108px minmax(0, 780px) 312px;
  grid-template-areas: "term cal side";
  justify-content: center;
  align-items: start;
  gap: 22px;
}

/* 竖排节气卡（左侧） */
.term-card {
  grid-area: term;
  position: sticky;
  top: 18px;
  border-radius: var(--radius-l);
  border: 1px solid var(--glass-brd);
  background: var(--glass-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow-soft);
  padding: 20px 10px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  min-height: 380px;
  transition: background 0.6s ease, border-color 0.6s ease;
}
.term-tag {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--ink-2);
  writing-mode: vertical-rl;
}
.term-name {
  writing-mode: vertical-rl;
  font-family: var(--font-term);
  font-size: clamp(38px, 4.2vw, 52px);
  letter-spacing: 14px;
  color: var(--term-color);
  text-shadow: 0 4px 22px var(--primary-soft);
  line-height: 1;
  flex: 1;
  display: flex;
  align-items: center;
  transition: color 0.8s ease;
}
.term-date {
  font-size: 11.5px;
  color: var(--ink-2);
  writing-mode: vertical-rl;
  letter-spacing: 2px;
  font-variant-numeric: tabular-nums;
}
.term-motto {
  font-size: 10.5px;
  color: var(--ink-2);
  writing-mode: vertical-rl;
  letter-spacing: 3px;
  opacity: 0.85;
}

/* ---------- 5. 中央玻璃月历卡 ---------- */
.cal-wrap {
  grid-area: cal;
  perspective: 1500px;
  will-change: transform;
}
.cal-card {
  position: relative;
  border-radius: var(--radius-l);
  border: 1px solid var(--glass-brd);
  background:
    linear-gradient(160deg, rgba(255, 255, 255, 0.30), rgba(255, 255, 255, 0.06) 42%),
    var(--glass-bg);
  backdrop-filter: blur(14px) saturate(1.25);
  -webkit-backdrop-filter: blur(14px) saturate(1.25);
  box-shadow: var(--shadow-deep);
  padding: clamp(16px, 2.4vw, 28px) clamp(14px, 2.2vw, 26px) clamp(14px, 2vw, 22px);
  transform-style: preserve-3d;
  transition: background 0.6s ease, border-color 0.6s ease;
  overflow: hidden;
}
/* 玻璃卡上的纸白薄层，保证文字对比度（WCAG AA） */
.cal-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.18);
  pointer-events: none;
}
body[data-season="summer"] .cal-card::before,
body.night .cal-card::before { background: rgba(255, 255, 255, 0.04); }
.cal-card > * { position: relative; }

.cal-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.cal-title {
  font-size: clamp(22px, 2.6vw, 30px);
  font-weight: 700;
  letter-spacing: 3px;
  font-variant-numeric: tabular-nums;
}
.cal-title em {
  font-style: normal;
  color: var(--primary);
}
.cal-sub {
  font-size: 12.5px;
  color: var(--ink-2);
  letter-spacing: 2px;
}
.week-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}
.week-row span {
  text-align: center;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--ink-2);
  padding: 4px 0;
}
.week-row span.wend { color: var(--primary); opacity: 0.8; }

.grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: clamp(52px, 9.2vh, 80px);
  gap: 6px;
}
.cell {
  position: relative;
  border-radius: var(--radius-s);
  border: 1px solid transparent;
  background: transparent;
  padding: 7px 8px 5px;
  cursor: pointer;
  overflow: hidden;
  outline: none;
  display: flex;
  flex-direction: column;
  transition:
    background 0.24s ease,
    transform 0.24s var(--ease-out),
    box-shadow 0.24s ease,
    border-color 0.24s ease;
  /* 入场 stagger：JS 注入 --i */
  opacity: 0;
}
body.ready .cell {
  animation: cellIn 0.5s var(--ease-out) both;
  animation-delay: calc(var(--i) * 14ms);
}
/* 静默重绘（事件增删后）：不重放入场 stagger */
.grid.still .cell {
  animation: none !important;
  opacity: 1;
}
.grid.still .cell.dim {
  opacity: 0.32;
}
@keyframes cellIn {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.cell .d {
  font-size: clamp(14px, 1.35vw, 17px);
  font-weight: 600;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
}
.cell .sub {
  margin-top: auto;
  font-size: clamp(9px, 0.9vw, 11px);
  line-height: 1.25;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cell .sub.fest { color: var(--primary); font-weight: 600; }
.cell .sub.term { color: var(--term-color); font-weight: 600; }
.cell .off {
  position: absolute;
  top: 4px;
  right: 5px;
  font-style: normal;
  font-size: 9px;
  line-height: 1;
  padding: 3px 4px;
  border-radius: 5px;
  background: #E03131;
  color: #fff;
  letter-spacing: 0;
  box-shadow: 0 2px 8px rgba(224, 49, 49, 0.4);
}
.cell .evd {
  position: absolute;
  bottom: 4px;
  right: 5px;
  display: flex;
  gap: 3px;
}
.cell .evd i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--ev-c, var(--primary));
  box-shadow: 0 0 6px var(--ev-c, var(--primary));
}
.cell.dim { opacity: 0.32; cursor: default; }
body.ready .cell.dim { animation: none; opacity: 0.32; }
.cell.weekend .d { color: var(--primary); }
body[data-season="summer"] .cell.weekend .d,
body.night .cell.weekend .d { color: var(--primary); }
.cell.today {
  background: var(--primary);
  border-color: rgba(255, 255, 255, 0.4);
  box-shadow: 0 8px 26px var(--primary-soft), 0 0 0 1px var(--primary) inset;
}
.cell.today .d,
.cell.today .sub,
.cell.today .sub.fest,
.cell.today .sub.term { color: #fff; }
body[data-season="summer"] .cell.today .d,
body[data-season="summer"] .cell.today .sub,
body.night .cell.today .d,
body.night .cell.today .sub { color: #10131f; }
/* hover 微交互：玻璃高亮 + 轻浮起 */
.cell:not(.dim):hover,
.cell:not(.dim):focus-visible {
  background: var(--hover);
  border-color: var(--glass-brd);
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 10px 24px rgba(30, 20, 40, 0.14);
  z-index: 2;
}
body.night .cell:not(.dim):hover { box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4); }

/* 翻月 3D 轻翻转 */
@keyframes flipNext {
  0%   { transform: rotateY(0deg) rotateX(0deg); }
  38%  { transform: rotateY(-11deg) rotateX(3deg) scale(0.985); }
  100% { transform: rotateY(0deg) rotateX(0deg) scale(1); }
}
@keyframes flipPrev {
  0%   { transform: rotateY(0deg) rotateX(0deg); }
  38%  { transform: rotateY(11deg) rotateX(3deg) scale(0.985); }
  100% { transform: rotateY(0deg) rotateX(0deg) scale(1); }
}
.cal-card.flip-next { animation: flipNext 0.62s var(--ease-out); }
.cal-card.flip-prev { animation: flipPrev 0.62s var(--ease-out); }

.cal-foot {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed var(--glass-brd);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 11.5px;
  color: var(--ink-2);
  letter-spacing: 1px;
}
.legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.lg-off {
  font-style: normal;
  font-size: 9px;
  padding: 2px 3px;
  border-radius: 4px;
  background: #E03131;
  color: #fff;
}
.lg-term { width: 8px; height: 8px; border-radius: 2px; background: var(--term-color); display: inline-block; }
.lg-fest { width: 8px; height: 8px; border-radius: 2px; background: var(--primary); display: inline-block; }
.lg-today { width: 10px; height: 10px; border-radius: 3px; background: var(--primary); display: inline-block; box-shadow: 0 0 8px var(--primary); }

/* ---------- 6. 右侧信息列：倒计时 + 本月节点 ---------- */
.side {
  grid-area: side;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}
.glass-card {
  border-radius: var(--radius-l);
  border: 1px solid var(--glass-brd);
  background: var(--glass-bg);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: var(--shadow-soft);
  padding: 20px 20px 18px;
  transition: background 0.6s ease, border-color 0.6s ease;
}
.card-title {
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--ink-2);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title::before {
  content: "";
  width: 14px;
  height: 2px;
  border-radius: 2px;
  background: var(--primary);
}
.cd-box {
  display: flex;
  align-items: center;
  gap: 18px;
}
.cd-ring {
  --pct: 0.35;
  width: 96px;
  height: 96px;
  flex: 0 0 96px;
  border-radius: 50%;
  background: conic-gradient(var(--primary) calc(var(--pct) * 360deg), var(--glass-brd) 0);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.6s ease;
  position: relative;
}
.cd-ring::after {
  content: "";
  position: absolute;
  inset: 7px;
  border-radius: 50%;
  background: var(--bg-solid);
  opacity: 0.92;
  transition: background 0.8s ease;
}
.cd-num {
  position: relative;
  z-index: 1;
  text-align: center;
  line-height: 1;
}
.cd-num b {
  font-size: 34px;
  font-weight: 700;
  color: var(--primary);
  font-variant-numeric: tabular-nums;
}
.cd-num i {
  font-style: normal;
  font-size: 11px;
  color: var(--ink-2);
  letter-spacing: 2px;
  display: block;
  margin-top: 3px;
}
.cd-info { min-width: 0; }
.cd-name {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 2px;
}
.cd-meta {
  margin-top: 6px;
  font-size: 12px;
  color: var(--ink-2);
  letter-spacing: 1px;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
}
.fest-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow: auto; }
.fest-list li {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  letter-spacing: 1px;
  padding: 7px 10px;
  border-radius: var(--radius-s);
  background: var(--hover);
  border: 1px solid transparent;
  transition: transform 0.2s var(--ease-out), border-color 0.2s ease;
}

}

.drawer {

  right: 0;
  z-index: 19;

}

    autumn: { cn: '秋', label: '秋 · 红叶', motto: '金风玉露 · 叶落知秋', greet: '秋飞叶' },
    winter: { cn: '冬', label: '冬 · 飘雪', motto: '瑞雪兆丰 · 岁暮天寒', greet: '冬飘雪' }
  };
  var SEASON_ORDER = ['spring', 'summer', 'autumn', 'winter'];
  var CN_MONTHS = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];
  var WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  var CATS = {
    work:   { label: '工作', c: '#4DABF7' },
    life:   { label: '生活', c: '#51CF66' },
    memo:   { label: '纪念', c: '#FF6B6B' },
    study:  { label: '学习', c: '#B197FC' },
    health: { label: '健康', c: '#FFA94D' }
  };

  /* ==========================================================
     二、通用工具
     ========================================================== */

  function $(id) { return document.getElementById(id); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function keyOf(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }      // m: 0-based
  function mdKey(m, d) { return pad2(m) + '-' + pad2(d); }                        // 'MM-DD'
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function dayDiff(a, b) {
    return Math.round((b - a) / 86400000);
  }
  function dayOfYear(dt) {
    var start = new Date(dt.getFullYear(), 0, 1);
    return dayDiff(start, dt) + 1;
  }
  function lunarDayName(d) {
    var ones = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    if (d === 10) return '初十';
    if (d === 20) return '二十';
    if (d === 30) return '三十';
    if (d < 10) return '初' + ones[d];
    if (d < 20) return '十' + ones[d - 10];
    return '廿' + ones[d - 20];
  }
  // 农历查询：返回如 { name: '八月', day: 15, text: '中秋节' 前置由调用方处理 }
  function lunarOf(y, m, d) {
    var target = new Date(y, m, d).getTime();
    var seg = null;
    for (var i = 0; i < LUNAR_MONTHS_2026.length; i++) {
      var s = LUNAR_MONTHS_2026[i];
      var st = new Date(s.y, s.m, s.d).getTime();
      if (st <= target) seg = s; else break;
    }
    if (!seg) return { text: '' };
    var idx = Math.round(dayDiff(new Date(seg.y, seg.m, seg.d), new Date(y, m, d))) + 1;
    if (idx < 1 || idx > seg.days) return { text: '' };
    return { name: seg.name, day: idx, text: idx === 1 ? seg.name : lunarDayName(idx) };
  }
  function seasonOfMonth(m0) { // m0: 0-based month
    if (m0 >= 2 && m0 <= 4) return 'spring';
    if (m0 >= 5 && m0 <= 7) return 'summer';
    if (m0 >= 8 && m0 <= 10) return 'autumn';
    return 'winter';
  }
  function store(key, val) {
    try {
      if (arguments.length === 2) { localStorage.setItem(key, JSON.stringify(val)); return val; }
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  /* ==========================================================
     三、全局状态
     ========================================================== */

  var NOW = new Date();                                 // 真实今天
  var TODAY_KEY = keyOf(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  var view = {                                          // 当前浏览月（数据限定 2026）
    y: 2026,
    m: NOW.getFullYear() === 2026 ? NOW.getMonth() : clamp(NOW.getMonth(), 0, 11)
  };
  var season = seasonOfMonth(view.m);
  var events = store('shiguangli_events_v1') || {};     // { '2026-09-08': [{t,time,cat}] }
  var nightPref = store('shiguangli_night_v1') || 'auto'; // auto | on | off
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FINE_POINTER = window.matchMedia('(pointer: fine)').matches;

  /* ==========================================================
     四、月历渲染
     ========================================================== */

  var gridEl = $('grid');
  var calCard = $('calCard');
  var calTitle = $('calTitle');
  var calSub = $('calSub');
  var monthLabel = $('monthLabel');
  var seasonText = $('seasonText');

  function cellInfo(y, m, d) {
    var k = keyOf(y, m, d);
    var md = k.slice(5);
    var info = { key: k, fest: null, term: null, off: false, sub: '', subType: 'lunar' };
    if (LUNAR_FESTIVALS_2026[md]) { info.fest = LUNAR_FESTIVALS_2026[md]; info.sub = info.fest; info.subType = 'fest'; }
    else if (HOLIDAYS_2026[md] && md !== '02-16') { info.fest = HOLIDAYS_2026[md].name; info.sub = info.fest; info.subType = 'fest'; }
    else if (md === '02-16') { info.sub = '除夕'; info.subType = 'fest'; info.fest = '除夕'; }
    else if (SOLAR_TERMS_2026[md]) { info.term = SOLAR_TERMS_2026[md]; info.sub = info.term; info.subType = 'term'; }
    else { info.sub = lunarOf(y, m, d).text || ''; }
    if (HOLIDAYS_2026[md] && HOLIDAYS_2026[md].off) info.off = true;
    return info;
  }

  function renderCalendar(dir, animate) {
    var y = view.y, m = view.m;
    if (animate === undefined) animate = true;
    gridEl.classList.toggle('still', !animate);
    var first = new Date(y, m, 1);
    var startOffset = (first.getDay() + 6) % 7;         // 周一开头
    var monthDays = new Date(y, m + 1, 0).getDate();
    var prevDays = new Date(y, m, 0).getDate();

    calTitle.innerHTML = y + '年 <em>' + CN_MONTHS[m] + '月</em>';
    calSub.textContent = SEASON_META[season].greet + ' · 共 ' + monthDays + ' 天 · 点击日期添加事件';
    monthLabel.textContent = y + '年' + (m + 1) + '月';
    $('btnPrev').disabled = (y === 2026 && m === 0);
    $('btnNext').disabled = (y === 2026 && m === 11);

    var frag = document.createDocumentFragment();
    var todayInView = (NOW.getFullYear() === y && NOW.getMonth() === m);

    for (var i = 0; i < 42; i++) {
      var cell = document.createElement('div');
      var dayNum, inMonth = true, cellY = y, cellM = m;
      if (i < startOffset) {
        dayNum = prevDays - startOffset + 1 + i;
        inMonth = false;
        cellM = m - 1;
      } else if (i >= startOffset + monthDays) {
        dayNum = i - startOffset - monthDays + 1;
        inMonth = false;
        cellM = m + 1;
      } else {
        dayNum = i - startOffset + 1;
      }
      var weekdayCol = i % 7;
      cell.className = 'cell';
      cell.style.setProperty('--i', i);
      cell.setAttribute('role', 'gridcell');
      cell.setAttribute('tabindex', '0');

      if (!inMonth) {
        var dimOk = (cellM >= 0 && cellM <= 11);        // 2027 年 1 月无数据，置灰禁用
        if (!dimOk) { cell.className += ' dim'; }
        var lbl = (cellM + 1) + '月' + dayNum + '日';
        cell.setAttribute('aria-label', lbl);
        cell.innerHTML = '<span class="d">' + dayNum + '</span>';
        if (dimOk) cell.dataset.key = keyOf(y, cellM, dayNum);
        if (weekdayCol >= 5) cell.className += ' weekend';
      } else {
        var info = cellInfo(y, m, dayNum);
        var isToday = todayInView && dayNum === NOW.getDate();
        if (isToday) cell.className += ' today';
        if (weekdayCol >= 5) cell.className += ' weekend';
        var subCls = info.subType === 'fest' ? 'sub fest' : (info.subType === 'term' ? 'sub term' : 'sub');
        var evs = events[info.key] || [];
        var dotHtml = '';
        if (evs.length) {
          dotHtml = '<span class="evd">';
          for (var e = 0; e < Math.min(3, evs.length); e++) {
            dotHtml += '<i style="--ev-c:' + (CATS[evs[e].cat] || CATS.work).c + '"></i>';
          }
          dotHtml += '</span>';
        }
        cell.dataset.key = info.key;
        cell.setAttribute('aria-label', (m + 1) + '月' + dayNum + '日 ' +
          (info.fest ? info.fest : '') + (info.term ? ' ' + info.term : '') + (info.off ? ' 休' : ''));
        cell.innerHTML =
          '<span class="d">' + dayNum + '</span>' +
          (info.sub ? '<span class="' + subCls + '">' + esc(info.sub) + '</span>' : '<span class="sub"></span>') +
          (info.off ? '<i class="off">休</i>' : '') + dotHtml;
      }
      frag.appendChild(cell);
    }
    gridEl.innerHTML = '';
    gridEl.appendChild(frag);

    if (!REDUCED && dir) {
      var cls = dir > 0 ? 'flip-next' : 'flip-prev';
      calCard.classList.remove('flip-next', 'flip-prev');
      void calCard.offsetWidth;                          // 重置动画
      calCard.classList.add(cls);
      setTimeout(function () { calCard.classList.remove(cls); }, 700);
    }
    renderFestList();
  }

  function gotoMonth(dir) {
    var nm = view.m + dir;
    if (nm < 0 || nm > 11) return;
    view.m = nm;
    var ns = seasonOfMonth(nm);
    FX.gust(dir);                                        // 翻月：粒子风向响应
    if (ns !== season) { season = ns; applySeason(); }   // 跨季：粒子渐变迁移
    renderCalendar(dir);
  }
  function gotoToday() {
    var tm = NOW.getFullYear() === 2026 ? NOW.getMonth() : clamp(NOW.getMonth(), 0, 11);
    var dir = tm > view.m ? 1 : (tm < view.m ? -1 : 0);
    view.m = tm;
    var ns = seasonOfMonth(tm);
    if (ns !== season) { season = ns; applySeason(); }
    renderCalendar(dir || 1);
  }

  // 季节应用：body 主题 + 粒子渐变迁移
  function applySeason() {
    document.body.setAttribute('data-season', season);
    var meta = SEASON_META[season];
    seasonText.textContent = meta.label;
    renderTermCard();
    FX.setSeason(season);
  }

  /* ==========================================================
     五、左侧节气卡（竖排大字）
     ========================================================== */

  function termEntries() {
    var list = [];
    for (var md in SOLAR_TERMS_2026) {
      var mm = parseInt(md.slice(0, 2), 10), dd = parseInt(md.slice(3), 10);
      list.push({ m: mm, d: dd, name: SOLAR_TERMS_2026[md], t: new Date(2026, mm - 1, dd) });
    }
    list.sort(function (a, b) { return a.t - b.t; });
    return list;
  }
  function renderTermCard() {
    var all = termEntries();
    var nowT = new Date();
    var cur = null, next = null;
    for (var i = 0; i < all.length; i++) {
      if (all[i].t <= nowT) cur = all[i];
      else if (!next) next = all[i];
    }
    var show = next || cur || all[0];
    var isToday = cur && cur.t.toDateString() === nowT.toDateString();
    $('termName').textContent = show.name;
    $('termDate').textContent = (show.m) + '月' + show.d + '日' + (isToday ? ' · 今日' : ' · 将至');
    $('termMotto').textContent = SEASON_META[season].motto;
  }

  /* ==========================================================
     六、倒计时（时间流沙）与本月节点
     ========================================================== */

  function nextFestival() {
    var base = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
    for (var i = 0; i < FESTIVAL_TIMELINE.length; i++) {
      var f = FESTIVAL_TIMELINE[i];
      var t = new Date(2026, f.m - 1, f.d);
      if (dayDiff(base, t) >= 0) return { f: f, date: t, days: dayDiff(base, t) };
    }
    return { f: { name: '元旦' }, date: new Date(2027, 0, 1), days: dayDiff(base, new Date(2027, 0, 1)) };
  }
  function renderCountdown() {
    var nx = nextFestival();
    $('cdName').textContent = nx.f.name;
    $('cdDays').textContent = nx.days === 0 ? '今天' : nx.days;
    $('cdMeta').textContent = '2026年' + (nx.date.getMonth() + 1) + '月' + nx.date.getDate() + '日 · ' +
      WEEKDAYS[nx.date.getDay()] + (nx.days === 0 ? ' · 就在今天' : ' · 距今 ' + nx.days + ' 天');
    var pct = clamp(1 - nx.days / 365, 0.04, 1);
    $('cdRing').style.setProperty('--pct', pct.toFixed(3));
  }
  function renderFestList() {
    var box = $('festList');
    var items = [];
    var m = view.m;
    for (var d = 1; d <= 31; d++) {
      var md = mdKey(m + 1, d);
      var dt = new Date(2026, m, d);
      if (dt.getMonth() !== m) break;
      if (LUNAR_FESTIVALS_2026[md]) items.push({ d: d, name: LUNAR_FESTIVALS_2026[md], kind: 'fest', tag: '农历节日' });
      else if (HOLIDAYS_2026[md]) items.push({ d: d, name: HOLIDAYS_2026[md].name, kind: 'holiday', tag: HOLIDAYS_2026[md].off ? '法定休假' : '纪念日' });
      if (SOLAR_TERMS_2026[md]) items.push({ d: d, name: SOLAR_TERMS_2026[md], kind: 'term', tag: '节气' });
    }
    items.sort(function (a, b) { return a.d - b.d; });
    if (!items.length) {
      box.innerHTML = '<li class="fest-empty">本月暂无节日与节气，宜安静过日子。</li>';
      return;
    }
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      html += '<li><span class="k-dot k-' + it.kind + '"></span><b>' + (m + 1) + '/' + it.d + '</b>' +
        esc(it.name) + '<span>' + it.tag + '</span></li>';
    }
    box.innerHTML = html;
  }

  /* ==========================================================
     七、事件面板（localStorage 持久化）
     ========================================================== */

  var drawer = $('drawer'), mask = $('mask');
  var evListEl = $('evList');
  var openKey = null;

  function drawerMetaText(k) {
    var p = k.split('-');
    var y = +p[0], m = +p[1] - 1, d = +p[2];
    var dt = new Date(y, m, d);
    var md = k.slice(5);
    var bits = [WEEKDAYS[dt.getDay()]];
    var lu = lunarOf(y, m, d);
    if (lu.text) bits.push('农历' + lu.text);
    if (SOLAR_TERMS_2026[md]) bits.push(SOLAR_TERMS_2026[md]);
    if (LUNAR_FESTIVALS_2026[md]) bits.push(LUNAR_FESTIVALS_2026[md]);
    if (HOLIDAYS_2026[md] && HOLIDAYS_2026[md].off) bits.push('法定休假');
    return bits.join(' · ');
  }
  function openDrawer(k) {
    if (!k) return;
    openKey = k;
    var p = k.split('-');
    $('dTitle').textContent = (+p[1]) + '月' + (+p[2]) + '日';
    $('dMeta').textContent = drawerMetaText(k);
    renderEvList();
    drawer.classList.add('on');
    mask.classList.add('on');
    setTimeout(function () { $('evTitle').focus(); }, 320);
  }
  function closeDrawer() {
    openKey = null;
    drawer.classList.remove('on');
    mask.classList.remove('on');
  }
  function renderEvList() {
    var evs = events[openKey] || [];
    if (!evs.length) {
      evListEl.innerHTML = '<li class="ev-empty">这一天还空着<br>在下方写下要做的事吧</li>';
      return;
    }
    var html = '';
    for (var i = 0; i < evs.length; i++) {
      var ev = evs[i];
      var cat = CATS[ev.cat] || CATS.work;
      html += '<li class="ev-item" style="--ev-c:' + cat.c + '">' +
        '<span class="cat-dot"></span>' +
        '<span class="ev-t">' + esc(ev.t) + '</span>' +
        (ev.time ? '<span class="ev-time">' + esc(ev.time) + '</span>' : '') +
        '<button class="ev-del" data-i="' + i + '" aria-label="删除事件">✕</button>' +
        '</li>';
    }
    evListEl.innerHTML = html;
  }
  function saveEvents() {
    store('shiguangli_events_v1', events);
    renderCalendar(0, false);
  }
  $('evForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = $('evTitle').value.trim();
    if (!t || !openKey) return;
    if (!events[openKey]) events[openKey] = [];
    events[openKey].push({ t: t, time: $('evTime').value || '', cat: $('evCat').value });
    $('evTitle').value = '';
    $('evTime').value = '';
    saveEvents();
    renderEvList();
  });
  evListEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.ev-del');
    if (!btn) return;
    var idx = +btn.getAttribute('data-i');
    var evs = events[openKey];
    if (evs && evs[idx]) { evs.splice(idx, 1); if (!evs.length) delete events[openKey]; }
    saveEvents();
    renderEvList();
  });
  $('dClose').addEventListener('click', closeDrawer);
  mask.addEventListener('click', closeDrawer);

  /* ==========================================================
     八、悬浮提示（hover 日期格预览）
     ========================================================== */

  var tipEl = $('tip');
  gridEl.addEventListener('mouseover', function (e) {
    var cell = e.target.closest('.cell');
    if (!cell || !cell.dataset.key) return;
    var k = cell.dataset.key;
    var p = k.split('-');
    var md = k.slice(5);
    var evs = events[k] || [];
    var head = (+p[1]) + '月' + (+p[2]) + '日 · ' + WEEKDAYS[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
    var subBits = [];
    if (LUNAR_FESTIVALS_2026[md]) subBits.push(LUNAR_FESTIVALS_2026[md]);
    else if (HOLIDAYS_2026[md]) subBits.push(HOLIDAYS_2026[md].name + (HOLIDAYS_2026[md].off ? '（休）' : ''));
    else if (md === '02-16') subBits.push('除夕（休）');
    if (SOLAR_TERMS_2026[md]) subBits.push('节气 · ' + SOLAR_TERMS_2026[md]);
    var lu = lunarOf(+p[0], +p[1] - 1, +p[2]);
    if (lu.text && !LUNAR_FESTIVALS_2026[md]) subBits.push('农历' + lu.text);
    var html = '<div class="t-head">' + esc(head) + '</div>';
    if (subBits.length) html += '<div class="t-sub">' + esc(subBits.join(' · ')) + '</div>';
    if (evs.length) {
      html += '<div class="t-ev">';
      for (var i = 0; i < Math.min(3, evs.length); i++) {
        html += esc((evs[i].time ? evs[i].time + ' ' : '') + evs[i].t) + '<br>';
      }
      if (evs.length > 3) html += '还有 ' + (evs.length - 3) + ' 项…';
      html += '</div>';
    } else {
      html += '<div class="t-sub">点击添加事件</div>';
    }
    tipEl.innerHTML = html;
    tipEl.classList.add('on');
  });
  gridEl.addEventListener('mousemove', function (e) {
    if (!tipEl.classList.contains('on')) return;
    var x = clamp(e.clientX + 14, 8, window.innerWidth - 270);
    var y = clamp(e.clientY + 16, 8, window.innerHeight - 120);
    tipEl.style.left = x + 'px';
    tipEl.style.top = y + 'px';
  });
  gridEl.addEventListener('mouseleave', function () { tipEl.classList.remove('on'); });
  gridEl.addEventListener('click', function (e) {
    var cell = e.target.closest('.cell');
    if (cell && cell.dataset.key) { tipEl.classList.remove('on'); openDrawer(cell.dataset.key); }
  });
  gridEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      var cell = e.target.closest('.cell');
      if (cell && cell.dataset.key) { e.preventDefault(); openDrawer(cell.dataset.key); }
    }
  });

  /* ==========================================================
     九、实时时钟 / 日期行 / 夜空模式
     ========================================================== */

  var lastQuoteDay = -1;
  function nearestPastTerm() {
    var all = termEntries(), cur = null;
    for (var i = 0; i < all.length; i++) { if (all[i].t <= NOW) cur = all[i]; }
    return cur;
  }
  function tick() {
    var n = new Date();
    $('clock').textContent = pad2(n.getHours()) + ':' + pad2(n.getMinutes()) + ':' + pad2(n.getSeconds());
    var md = mdKey(n.getMonth() + 1, n.getDate());
    var bits = n.getFullYear() + '年' + (n.getMonth() + 1) + '月' + n.getDate() + '日 · ' + WEEKDAYS[n.getDay()];
    var lu = lunarOf(n.getFullYear(), n.getMonth(), n.getDate());
    if (lu.text) bits += ' · 农历' + lu.text;
    if (SOLAR_TERMS_2026[md]) bits += ' · 今日<b>' + SOLAR_TERMS_2026[md] + '</b>';
    else {
      var pt = nearestPastTerm();
      if (pt) bits += ' · ' + pt.name + '已至';
    }
    $('dateLine').innerHTML = bits;

    // 每日一句：按年内序数轮换
    var doy = dayOfYear(n);
    if (doy !== lastQuoteDay) {
      lastQuoteDay = doy;
      $('quoteText').textContent = QUOTES[doy % QUOTES.length];
    }
    // 夜空模式按分钟重估
    var nightKey = n.getHours() * 60 + n.getMinutes();
    if (nightKey !== tick._nk) { tick._nk = nightKey; applyNight(); }
  }
  function computeNight() {
    if (nightPref === 'on') return true;
    if (nightPref === 'off') return false;
    var h = new Date().getHours();                       // 读取实时时间，页面常驻也能跨 18:00 自动切换
    return h >= 18 || h < 6;
  }
  function applyNight() {
    var on = computeNight();
    document.body.classList.toggle('night', on);
    FX.setNight(on);
    var label = nightPref === 'auto' ? '夜空 · 自动' : (nightPref === 'on' ? '夜空 · 常开' : '夜空 · 关闭');
    var btn = $('btnNight');
    btn.textContent = label;
    btn.style.color = nightPref === 'off' ? 'var(--ink-2)' : '';
  }

  /* ==========================================================
     十、Canvas 粒子系统（四季 + 极光 + 积雪 + 星空）
     性能：数量自适应 / DPR 钳制 / 页签隐藏暂停 / FPS 降载
     ========================================================== */

    /* ----- 季节配方 ----- */

      setNight: setNight,
      gust: function (dir) {
        for (var i = 0; i < particles.length; i++) {
          particles[i].ix += dir * (2 + Math.random() * 2.6);
          particles[i].iy += (Math.random() - 0.5) * 1.6;
        }
      },
      bridge: function (fn) { FXIntro = fn; }
    };
  })();

  // intro 期间向主循环暴露 ready/dt 信号
  var introAPI = {
    dt: 16.7,
    ready: function () {
      if (!document.body.classList.contains('ready')) document.body.classList.add('ready');
    },
    mark: function () {}
  };
  FX.bridge(introAPI);

  /* ==========================================================
     十一、视差微动（指针 + 滚动）
     ========================================================== */

  function initParallax() {
    if (REDUCED || !FINE_POINTER) return;
    var calCard = $('calCard');
    var haze = $('haze');
    var termCard = document.querySelector('.term-card');
    var tx = 0, ty = 0, cx = 0, cy = 0;
    window.addEventListener('pointermove', function (e) {
      tx = (e.clientX / window.innerWidth - 0.5) * 2;
      ty = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });
    (function loop() {
      cx += (tx - cx) * 0.06;
      cy += (ty - cy) * 0.06;
      // 指针视差作用在月历卡上（与翻转动画同元素，动画期间由 keyframes 接管）
      if (calCard) calCard.style.transform = 'rotateY(' + (cx * 2.2).toFixed(2) + 'deg) rotateX(' + (-cy * 1.6).toFixed(2) + 'deg)';
      if (haze) haze.style.marginLeft = (-cx * 10).toFixed(1) + 'px';
      requestAnimationFrame(loop);
    })();
    // 滚动视差：节气卡轻微反向漂移
    window.addEventListener('scroll', function () {
      var sy = window.scrollY || window.pageYOffset;
      if (termCard) termCard.style.marginTop = (sy * -0.08).toFixed(1) + 'px';
    }, { passive: true });
  }

  /* ==========================================================
     十二、控制与初始化
     ========================================================== */

  $('btnPrev').addEventListener('click', function () { gotoMonth(-1); });
  $('btnNext').addEventListener('click', function () { gotoMonth(1); });
  $('btnToday').addEventListener('click', gotoToday);
  $('btnNight').addEventListener('click', function () {
    nightPref = nightPref === 'auto' ? 'on' : (nightPref === 'on' ? 'off' : 'auto');
    store('shiguangli_night_v1', nightPref);
    applyNight();
  });
  document.addEventListener('keydown', function (e) {
    if (e.target && /input|select|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'Escape') { closeDrawer(); return; }
    if (e.key === 'ArrowLeft') gotoMonth(-1);
    else if (e.key === 'ArrowRight') gotoMonth(1);
    else if (e.key === 't' || e.key === 'T') gotoToday();
  });

  function init() {
    applySeason();
    renderCalendar(0);
    renderCountdown();
    renderTermCard();
    FX.init(season);
    applyNight();
    tick();
    setInterval(tick, 1000);
    if (REDUCED) document.body.classList.add('ready');
    initParallax();
    // 定时刷新倒计时（跨天零点场景）
    setInterval(renderCountdown, 60000);
  }

  init();
})();
</script>
</body>
</html>
