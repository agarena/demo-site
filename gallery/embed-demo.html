const grid=document.getElementById('grid'),bar=document.getElementById('bar');
let filter='all';
const cats=[['all','全部'],['standard','标准'],['cool','炫酷']].concat(M.themes.map(t=>[t.id,t.name]));
cats.forEach(([v,label],i)=>{const b=document.createElement('button');b.textContent=label+(v==='all'?' ('+M.count+')':'');if(i===0)b.className='on';
 b.onclick=()=>{filter=v;document.querySelectorAll('#bar button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};bar.appendChild(b);});
function render(){grid.innerHTML='';M.sites.filter(s=>filter==='all'||s.category===filter||s.themeId===filter).forEach(s=>{
 const d=document.createElement('div');d.className='card';
 d.innerHTML='<span class="badge '+s.category+'">'+s.categoryName+'</span> '+(s.tags||[]).map(t=>'<span class="badge cool">'+t+'</span>').join(' ')
 +'<h3>'+s.styleName+'</h3><p>'+s.description+'</p><code>'+s.themeName+' / '+s.styleSlug+'</code>';
 d.onclick=()=>show(s);grid.appendChild(d);});}
function show(s){document.getElementById('t').textContent=s.styleName+' · '+s.themeName+'（'+s.categoryName+'）';
 document.getElementById('frame').src=s.path;
 document.getElementById('open').href=s.path;
 document.getElementById('copy').onclick=()=>{const code='<iframe src="'+location.origin+location.pathname.replace(/[^/]*$/,'')+s.path+'" title="'+s.styleName+'" loading="lazy" allow="autoplay" style="width:100%;aspect-ratio:16/9;border:0" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>';
 navigator.clipboard&&navigator.clipboard.writeText(code);document.getElementById('copy').textContent='已复制 ✓';setTimeout(()=>document.getElementById('copy').textContent='复制嵌入代码',1500);};
 document.getElementById('mask').style.display='flex';}
document.getElementById('close').onclick=()=>{document.getElementById('mask').style.display='none';document.getElementById('frame').src='';};
document.getElementById('mask').onclick=e=>{if(e.target.id==='mask'){document.getElementById('mask').style.display='none';document.getElementById('frame').src='';}};
render();
