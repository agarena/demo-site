<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例站点 · Demo</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --accent: #3b6cf6;
      --text: #1f2733;
      --muted: #6b7686;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .wrap { width: 100%; max-width: 720px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 8px 30px rgba(30, 50, 90, 0.08);
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .sub { color: var(--muted); margin-bottom: 24px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eef3ff;
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
    }
    .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .stats {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .stat {
      background: #f8fafc;
      border: 1px solid #eef1f5;
      border-radius: 12px;
      padding: 16px;
    }
    .stat .num { font-size: 26px; font-weight: 700; color: var(--accent); }
    .stat .label { font-size: 13px; color: var(--muted); }
    .note { margin-top: 24px; font-size: 13px; color: var(--muted); border-top: 1px dashed #e3e8ef; padding-top: 16px; }
    code { background: #f0f3f8; padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>👋 这是一个示例站点</h1>
      <p class="sub">用来演示静态网页托管 + 访客统计。随便改点东西，重新发布看链接变不变。</p>

      <span class="badge"><span class="dot"></span> 实时访客计数（第三方免登录 API）</span>

      <div class="stats">
        <div class="stat">
          <div class="num" id="hits">…</div>
          <div class="label">累计访问次数</div>
        </div>
        <div class="stat">
          <div class="num" id="today">…</div>
          <div class="label">今日访问（演示占位）</div>
        </div>
      </div>

      <p class="note">
        访客统计说明：本页是纯静态站点，没有后端服务器。计数来自公开 API
        <code>countapi.xyz</code>（免注册），浏览器直接调用。若要更完整的分析
        （来源、地域、停留时长），可嵌入 Umami / Plausible / Google Analytics 等第三方分析服务。
      </p>
    </div>
  </div>

  <script>
    // 用免费免登录的 countapi.xyz 实现访问计数
    const NAMESPACE = "workbuddy-demo";
    const KEY = "page-main";
    fetch("https://api.countapi.xyz/hit/" + NAMESPACE + "/" + KEY)
      .then(r => r.json())
      .then(d => {
        document.getElementById("hits").textContent = d.value;
        document.getElementById("today").textContent = "—";
      })
      .catch(() => {
        document.getElementById("hits").textContent = "统计不可用";
      });
  </script>
</body>
</html>
