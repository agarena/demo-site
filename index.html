<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="canvas:aspect-ratio" content="16:9" />
<title>AI Tools / Studio White</title>
<link rel="canonical" href="https://agarena.xyz/">
<link rel="preload" href="./fonts/instrument-sans-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="./fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
<style>
  /* 本地字体（SIL OFL 许可），取代 Google Fonts 外链：大陆访客可正常加载，无跨墙请求 */
  @font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url("./fonts/instrument-sans-latin-variable.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url("./fonts/inter-latin-variable.woff2") format("woff2")}
  :root{
    --seed-bg:#F6F7F9; --seed-fg:#0E0F13; --seed-primary:#0071E3;
    --seed-accent:#E8552D; --seed-surface:#FFFFFF; --seed-radius:22px;

    --bg:var(--seed-bg); --fg:var(--seed-fg); --surface:var(--seed-surface);
    --primary:var(--seed-primary); --accent:var(--seed-accent);
    --muted:color-mix(in srgb,var(--seed-fg) 56%,var(--seed-bg));
    --faint:color-mix(in srgb,var(--seed-fg) 40%,var(--seed-bg));
    --line:color-mix(in srgb,var(--seed-fg) 9%,transparent);
    --line-2:color-mix(in srgb,var(--seed-fg) 15%,transparent);
    --tint:color-mix(in srgb,var(--seed-primary) 6%,var(--seed-bg));
    --shadow-s:0 2px 10px -4px rgba(16,20,30,.18);
    --shadow-l:0 30px 70px -30px rgba(16,20,30,.34);
    --radius:var(--seed-radius); --radius-sm:calc(var(--seed-radius)*.55); --radius-pill:100px;
    --display:"Instrument Sans","Inter",system-ui,sans-serif;
    --body:"Inter","Instrument Sans",system-ui,sans-serif;
    /* product-render palette (screenshot content only, kept as tokens) */
    --p-blue:#3B82F6; --p-green:#10B981; --p-amber:#F59E0B; --p-red:#EF4444; --p-teal:#14B8C4; --p-rose:#FB7185;
    --nb-bg:#0B0E14; --nb-fg:#E7ECF3; --nb-muted:#AEB8C6; --nb-up:#3DDC97; --nb-news:#6EB2FF; --nb-soon:#B79CFF;
    --tk-height:36px; --tk-bg:var(--nb-bg); --tk-fg:#D6D6DC; --tk-accent:var(--primary); --tk-speed:60;
    --tk-news-bg:#2E3A48; --tk-news-fg:#8FC7FF; --tk-upd-bg:#20402E; --tk-upd-fg:#7DE0A7; --tk-ntc-bg:#3A3145; --tk-ntc-fg:#D0B4FF;
    --motion-mult:1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;letter-spacing:-.005em}
  a{color:inherit;text-decoration:none} button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  ::selection{background:var(--primary);color:#fff}
  .wrap{max-width:1200px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}
  .lbl{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:600;color:var(--muted)}

  /* nav */
  nav.top{position:sticky;top:0;z-index:40;backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:blur(14px);
    background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:64px}
  .wm{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:18px;display:flex;align-items:center;gap:10px}
  .wm .g{width:22px;height:22px;border-radius:7px;background:linear-gradient(140deg,var(--primary),color-mix(in srgb,var(--primary),var(--accent) 45%));box-shadow:var(--shadow-s)}
  .nlinks{display:flex;gap:30px;font-size:14px;color:var(--muted);font-weight:500}
  .nlinks a{transition:color calc(.2s*var(--motion-mult))} .nlinks a:hover{color:var(--fg)}
  .ncta{font-family:var(--display);font-weight:600;font-size:13px;color:#fff;background:var(--primary);
    border:1px solid var(--primary);border-radius:var(--radius-pill);padding:9px 18px;
    box-shadow:0 6px 18px color-mix(in srgb,var(--primary) 35%,transparent);
    transition:transform .16s,filter .2s}
  .ncta:hover{transform:translateY(-2px);filter:brightness(1.06)}

  /* ===== 顶部通知条(参考复用组件) ===== */
  .ticker{display:flex;align-items:stretch;height:var(--tk-height);background:var(--tk-bg);overflow:hidden;position:relative;z-index:41}
  .ticker .tk-label{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;background:var(--tk-accent);color:#fff;
    font-size:11px;font-weight:700;letter-spacing:.2em}
  .ticker .tk-label i{width:6px;height:6px;border-radius:50%;background:#fff;animation:tk-blink 1.6s infinite}
  @keyframes tk-blink{50%{opacity:.3}}
  .ticker .tk-clip{flex:1;overflow:hidden;display:flex;align-items:center}
  .ticker .tk-track{display:flex;width:max-content;will-change:transform}
  .ticker .item{display:inline-flex;align-items:center;gap:8px;padding:0 24px;white-space:nowrap;font-size:12px;letter-spacing:.04em;color:var(--tk-fg);text-decoration:none}
  .ticker a.item:hover{color:#fff;text-decoration:underline}
  .ticker .item i{font-style:normal;flex:none;font-size:10px;font-weight:700;letter-spacing:.08em;border-radius:4px;padding:2px 7px}
  .ticker .i-news{background:var(--tk-news-bg);color:var(--tk-news-fg)}
  .ticker .i-update{background:var(--tk-upd-bg);color:var(--tk-upd-fg)}
  .ticker .i-notice{background:var(--tk-ntc-bg);color:var(--tk-ntc-fg)}
  .ticker:hover .tk-track{animation-play-state:paused}
  @keyframes tk-move{to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.ticker .tk-track{animation:none!important}.ticker .tk-clip{overflow-x:auto}}

  /* intro strip — compact so tools share the fold */
  .intro{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding:14px 0 14px;flex-wrap:wrap}
  .intro .l{max-width:620px}
  .intro .lbl{margin-bottom:12px}
  .intro h1{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1;
    font-size:clamp(40px,5vw,64px)}
  .intro h1 em{font-style:normal;color:var(--primary)}
  .intro .r{text-align:right;color:var(--muted);font-size:14px;max-width:280px}
  .intro .r b{display:block;font-family:var(--display);font-size:34px;font-weight:700;color:var(--fg);letter-spacing:-.02em;line-height:1}

  /* showcase: flagship + 2 others, all above the fold */
  .show{display:grid;grid-template-columns:1.62fr 1fr;gap:20px;padding-bottom:14px;height:clamp(510px,58vh,600px);align-items:stretch}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s);
    transition:transform calc(.4s*var(--motion-mult)),box-shadow calc(.4s*var(--motion-mult));position:relative;overflow:hidden}
  .hero{display:grid;grid-template-columns:1.02fr .98fr;grid-template-rows:minmax(0,1fr);gap:26px;padding:26px;align-items:stretch}
  .h-info{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
  .h-gal{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;flex:1 1 auto;margin-top:8px;overflow:hidden}
  .hero .h-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .h-name{font-family:var(--display);font-weight:700;letter-spacing:-.03em;font-size:clamp(26px,2.6vw,38px)}
  .h-tag{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-family:var(--display);white-space:nowrap}
  .h-desc{color:var(--muted);font-size:15px;max-width:46ch;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .qa{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .qa .qa-h{margin-bottom:6px;flex:0 0 auto}
  .qa ul{list-style:none;display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:6px}
  .qa ul::-webkit-scrollbar{width:8px}
  .qa ul::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
  .qa ul::-webkit-scrollbar-track{background:transparent}
  .qitem{padding:10px 0;border-top:1px solid var(--line)}
  .qitem:first-child{border-top:0;padding-top:2px}
  .qitem .q{font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--fg);display:flex;gap:9px;align-items:baseline;letter-spacing:-.01em}
  .qitem .q i{font-style:normal;color:var(--primary);font-weight:700;font-size:11px;letter-spacing:.04em;flex:0 0 auto}
  .qitem .a{color:var(--muted);font-size:13px;margin-top:3px;padding-left:23px;line-height:1.55}
  .h-links{display:flex;align-items:center;justify-content:flex-end;gap:18px;margin-top:auto;padding-top:12px;flex:0 0 auto;border-top:1px solid var(--line)}
  .lnk{font-family:var(--display);font-weight:600;font-size:14px;color:var(--primary);display:inline-flex;align-items:center;gap:6px;transition:gap .2s}
  .lnk:hover{gap:10px}
  .lnk svg{width:14px;height:14px}

  /* product gallery: stacked card deck, auto-dealing carousel */
  /* 牌堆:占地固定 16:15(单图 16:9),每张牌本身严格 16:9;张数越多每层错位越薄,高度不变;
     前牌在最上,后面的牌向下逐层露出;逐层调暗/模糊/降饱和 + 投影做层次;deal=顶牌向上抽走 */
  .stageview{position:relative;flex:none;display:grid;aspect-ratio:16/15;background:radial-gradient(120% 120% at 50% 0%,var(--tint),transparent 70%),var(--surface);
    border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow-s)}
  .stageview.deck{cursor:pointer}
  .render{grid-area:1/1;width:100%;aspect-ratio:16/9;display:grid;place-items:center;
    border-radius:var(--radius-sm);background:var(--surface);overflow:hidden;
    box-shadow:0 12px 28px rgba(16,20,30,.14);
    transition:transform calc(.55s*var(--motion-mult)) cubic-bezier(.22,.75,.25,1),opacity calc(.4s*var(--motion-mult)) ease,filter calc(.4s*var(--motion-mult)) ease}
  .render.deal{transform:translate(26%,-135%) rotate(7deg)!important;z-index:40;
    transition:transform calc(.48s*var(--motion-mult)) cubic-bezier(.55,.06,.68,.19)}
  .render.snap{transition:none!important}
  .render.dh{opacity:0;pointer-events:none}
  .render svg{height:min(80%,232px);width:auto;max-width:92%;filter:drop-shadow(0 18px 30px rgba(16,20,30,.16))}

  /* all-tools scroll list (right column) */
  .alltools{display:flex;flex-direction:column;min-height:0;overflow:hidden;height:100%}
  .at-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .at-head .at-count{font-family:var(--display);font-size:12px;font-weight:600;color:var(--muted)}
  .at-scroll{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;
    scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
  .at-scroll::-webkit-scrollbar{width:8px}
  .at-scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
  .at-scroll::-webkit-scrollbar-track{background:transparent}
  .trow{display:grid;grid-template-columns:auto 1fr 56px;gap:12px;align-items:center;text-align:left;width:100%;
    padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
    transition:background .2s,border-color .2s,transform .2s,box-shadow .2s}
  .trow:hover{border-color:var(--line-2);transform:translateX(3px);box-shadow:var(--shadow-s)}
  .trow.on{border-color:var(--fg);box-shadow:var(--shadow-s)}
  .trow .tr-idx{font-family:var(--display);font-weight:700;font-size:12px;color:var(--faint);letter-spacing:.02em}
  .trow.on .tr-idx{color:var(--primary)}
  .tr-main{min-width:0;display:block}
  .tr-name{font-family:var(--display);font-weight:700;letter-spacing:-.01em;font-size:15px;display:flex;align-items:baseline;gap:8px}
  .tr-name .tr-tag{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-family:var(--display)}
  .tr-desc{color:var(--muted);font-size:12px;line-height:1.45;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .trow .tr-thumb{width:56px;height:42px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2,var(--bg))}
  .trow .tr-thumb svg{width:100%;height:100%;display:block}
  .trow .tr-thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .lnk:focus-visible,.trow:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:10px}
  .trow{position:relative}
  .trow::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--primary);
    transform:scaleY(0);transform-origin:center;transition:transform calc(.3s*var(--motion-mult)) cubic-bezier(.2,.7,.2,1)}
  .trow.on::before{transform:scaleY(1)}
  @keyframes infoIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes galIn{from{opacity:0;transform:scale(.98) translateY(10px)}to{opacity:1;transform:none}}
  @keyframes qaIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .hero.swap .h-info{animation:infoIn calc(.5s*var(--motion-mult)) cubic-bezier(.2,.7,.2,1) both}
  .hero.swap .h-gal{animation:galIn calc(.55s*var(--motion-mult)) cubic-bezier(.2,.7,.2,1) both}
  .hero.swap .qitem{animation:qaIn calc(.45s*var(--motion-mult)) both;animation-delay:calc(.18s + var(--i,0)*.08s)}

  /* demo modal + real-image support */
  .render img{width:100%;height:100%;object-fit:contain;display:block;background:var(--surface)}
  .demo-modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(14,16,22,.55);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:24px}
  .demo-modal.open{display:grid;animation:fadeIn calc(.25s*var(--motion-mult)) ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .demo-box{position:relative;width:min(920px,92vw);background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-l);
    animation:popIn calc(.35s*var(--motion-mult)) cubic-bezier(.2,.8,.2,1)}
  @keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .demo-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
  .demo-head b{font-family:var(--display);font-weight:700;font-size:16px}
  .demo-head span{color:var(--muted);font-size:13px;margin-left:8px}
  .demo-x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
  .demo-x:hover{background:var(--fg);color:var(--bg)}
  .demo-stage{background:radial-gradient(120% 120% at 50% 0%,var(--tint),var(--bg));aspect-ratio:16/9;display:grid;place-items:center}
  .demo-stage video,.demo-stage iframe{width:100%;height:100%;border:0;display:block;background:#000}
  .demo-stage img{width:100%;height:100%;object-fit:cover;display:block}
  .demo-ph{text-align:center;color:var(--muted);padding:20px}
  .demo-ph .play{width:64px;height:64px;border-radius:50%;background:var(--primary);display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 10px 30px color-mix(in srgb,var(--primary) 40%,transparent)}
  .demo-ph .play svg{width:26px;height:26px;color:#fff;margin-left:3px}
  .demo-foot{padding:12px 18px;font-size:12px;color:var(--faint);display:flex;justify-content:space-between}

  footer.cta{margin:26px 0 60px;background:var(--fg);color:var(--bg);border-radius:var(--radius);
    padding:clamp(30px,5vw,58px);display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap;box-shadow:var(--shadow-l)}
  footer.cta h2{font-family:var(--display);font-weight:700;letter-spacing:-.03em;font-size:clamp(24px,3vw,38px);line-height:1.05;max-width:16ch}
  footer.cta .fbtns{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .btn-p{display:inline-flex;align-items:center;gap:9px;background:var(--primary);color:#fff;font-family:var(--display);font-weight:600;
    font-size:15px;border-radius:var(--radius-pill);padding:13px 22px;transition:transform .16s,filter .2s}
  .btn-p:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .btn-k{color:var(--bg);opacity:.82;font-family:var(--display);font-weight:600;font-size:14px}
  .btn-k:hover{opacity:1}
  .fine{padding:0 0 40px;color:var(--faint);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  .reveal{opacity:0;transform:translateY(20px);transition:opacity calc(.7s*var(--motion-mult)) ease,transform calc(.7s*var(--motion-mult)) cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}

  @media (max-width:920px){
    .show{grid-template-columns:1fr;height:auto}
    .hero{grid-template-columns:1fr}
    .qa ul{max-height:460px}
    .alltools{height:auto;max-height:440px} .nlinks{display:none}
  }
  @media (max-width:560px){.intro .r{text-align:left}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.reveal{opacity:1;transform:none}}

  /* ===== 连续滚动 + 网页作品页 ===== */
  html{scroll-behavior:smooth;zoom:1.1}
  .page{scroll-margin-top:100px}

  /* light minimal contact strip (替代黑色 CTA 大色块) */
  .foot{margin:34px 0 40px;padding:22px 4px 0;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .foot .foot-c{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .foot .lbl{color:var(--faint)}
  .foot-mail{font-family:var(--display);font-weight:600;font-size:14px;color:var(--primary)}
  .foot-mail:hover{text-decoration:underline}
  .foot-fine{color:var(--faint);font-size:12px}

  /* ===== 作品区(8 精选 + 91 模板统一网格,封面懒加载/淡入) ===== */
  .tpl{padding-bottom:6px}
  .tpl-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:34px 0 4px}
  .tpl-head .tcount{font-family:var(--display);font-size:12px;font-weight:600;color:var(--muted)}
  .tpl-chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 16px}
  .chip{font-family:var(--display);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:7px 14px;transition:all .2s}
  .chip .n{opacity:.55;font-size:11px;margin-left:3px}
  .chip:hover{border-color:var(--line-2);color:var(--fg);transform:translateY(-1px)}
  .chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
  .tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow-s);display:flex;flex-direction:column;
    transition:transform calc(.4s*var(--motion-mult)),box-shadow calc(.4s*var(--motion-mult)),border-color .3s}
  .tcard:hover{transform:translateY(-5px);box-shadow:var(--shadow-l);border-color:var(--line-2)}
  .tcover{position:relative;aspect-ratio:16/9;overflow:hidden}
  .tcover-t{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
    padding:16px 18px;color:#fff}
  .tcover-t .ttheme{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
  .tcover-t .tstyle{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2;
    text-shadow:0 2px 12px rgba(0,0,0,.18)}
  .tshot{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transition:opacity .6s ease,transform calc(.5s*var(--motion-mult)) cubic-bezier(.2,.7,.2,1)}
  .tshot.ld{opacity:1}
  .tcard:hover .tshot.ld{transform:translateY(-4px) scale(1.02)}
  .tbadge{position:absolute;top:12px;right:12px;z-index:2;font-family:var(--display);font-size:10px;font-weight:600;
    letter-spacing:.06em;color:#fff;background:rgba(14,16,22,.45);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px}
  .tbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}

  // light, refined product render: white app window, soft colored widgets. view 0/1/2 = different layouts.

  function bigWidget(type,x,y,w,h){

      inner=card+'<rect x="'+(x+18)+'" y="'+(y+18)+'" width="150" height="12" rx="6" fill="rgba(16,20,30,.12)"/>'+wv+'<circle cx="'+(x+w-40)+'" cy="'+(y+h-30)+'" r="18" style="fill:var(--p-blue)"/>';}
    else if(type==="video"){let f='';for(let i=0;i<4;i++)f+='<rect x="'+(x+18+i*((w-40)/4))+'" y="'+(y+18)+'" width="'+((w-46)/4)+'" height="'+(h-90)+'" rx="8" fill="rgba(16,20,30,.06)"/><path d="M'+(x+34+i*((w-40)/4))+' '+(y+(h-90)/2+18)+' l14 9 -14 9z" style="fill:var(--p-red)"/>';
      inner=card+f+'<rect x="'+(x+18)+'" y="'+(y+h-46)+'" width="'+(w-36)+'" height="10" rx="5" fill="rgba(16,20,30,.08)"/><rect x="'+(x+18)+'" y="'+(y+h-46)+'" width="'+((w-36)*0.4)+'" height="10" rx="5" style="fill:var(--p-amber)"/>';}
    else if(type==="rag"){inner=card+'<rect x="'+(x+18)+'" y="'+(y+18)+'" width="120" height="26" rx="13" fill="rgba(16,20,30,.06)"/>'+
      '<rect x="'+(x+w-190)+'" y="'+(y+56)+'" width="170" height="40" rx="12" style="fill:var(--p-blue)"/>'+
      '<rect x="'+(x+18)+'" y="'+(y+108)+'" width="'+(w-120)+'" height="46" rx="12" fill="rgba(16,20,30,.05)"/><rect x="'+(x+w-150)+'" y="'+(y+h-40)+'" width="130" height="24" rx="12" fill="rgba(16,20,30,.06)"/>';}
    else if(type==="image"){let g='';for(let i=0;i<8;i++){const cx=x+18+(i%4)*((w-36)/4),cy=y+18+Math.floor(i/4)*((h-36)/2);g+='<rect x="'+cx+'" y="'+cy+'" width="'+((w-46)/4)+'" height="'+((h-46)/2)+'" rx="8" style="fill:'+cols[i%6]+'" opacity=".85"/>';}inner=card+g;}

    else if(type==="data"){const hs=[40,72,34,90,58,100,76];let q='';hs.forEach((hh,i)=>q+='<rect x="'+(x+22+i*((w-44)/hs.length))+'" y="'+(y+h-24-hh*(h/130))+'" width="'+((w-44)/hs.length-10)+'" height="'+(hh*(h/130))+'" rx="5" style="fill:'+(i===3?"var(--p-amber)":"var(--p-blue)")+'" opacity=".9"/>');inner=card+'<path d="M'+(x+20)+' '+(y+40)+' l120 -18 120 24 120 -30" stroke="rgba(16,20,30,.16)" stroke-width="2" fill="none"/>'+q;}

    return inner;

  function grid(type,x,y){let g="";const c=["var(--p-blue)","var(--p-green)","var(--p-amber)","var(--p-rose)"];for(let i=0;i<4;i++)g+='<rect x="'+(x+i*140)+'" y="'+y+'" width="120" height="130" rx="12" style="fill:var(--surface)" stroke="rgba(16,20,30,.08)"/><rect x="'+(x+i*140+16)+'" y="'+(y+16)+'" width="40" height="8" rx="4" style="fill:'+c[i]+'"/><rect x="'+(x+i*140+16)+'" y="'+(y+34)+'" width="80" height="8" rx="4" fill="rgba(16,20,30,.10)"/><rect x="'+(x+i*140+16)+'" y="'+(y+96)+'" width="70" height="14" rx="7" style="fill:'+c[i]+'" opacity=".85"/>';return g;}

  function list(type,x,y){let l='';for(let i=0;i<5;i++)l+='<rect x="'+x+'" y="'+(y+i*26)+'" width="376" height="18" rx="6" fill="rgba(16,20,30,.045)"/><circle cx="'+(x+12)+'" cy="'+(y+i*26+9)+'" r="4" style="fill:var(--p-blue)"/>';return l;}
  function thumb(type){ // compact for mini previews
    return '<svg viewBox="0 0 120 90"><rect width="120" height="90" style="fill:var(--surface)"/><rect x="8" y="8" width="46" height="7" rx="3.5" fill="rgba(16,20,30,.14)"/><rect x="8" y="26" width="104" height="30" rx="6" fill="rgba(16,20,30,.05)"/><rect x="8" y="64" width="30" height="18" rx="6" style="fill:var(--p-blue)" opacity=".85"/><rect x="44" y="66" width="60" height="7" rx="3.5" fill="rgba(16,20,30,.10)"/><rect x="44" y="78" width="40" height="6" rx="3" fill="rgba(16,20,30,.06)"/></svg>';

  function miniArt(type){ // stacked pair for side tiles
    return '<div class="mini"><svg viewBox="0 0 120 90"><rect width="120" height="90" style="fill:var(--surface)"/><rect x="10" y="12" width="40" height="6" rx="3" fill="rgba(16,20,30,.12)"/>'+barsFor(type)+'</svg></div>'+

  function barsFor(type){let b="";if(type==="voice"){for(let i=0;i<12;i++){const h=8+Math.abs(Math.sin(i*.6))*36;b+='<rect x="'+(10+i*8)+'" y="'+(60-h/2)+'" width="4" height="'+h+'" rx="2" style="fill:var(--p-blue)" opacity="'+(.4+(i%3)*.2)+'"/>'}}else if(type==="rag"){b='<rect x="10" y="30" width="60" height="14" rx="7" style="fill:var(--p-blue)" opacity=".8"/><rect x="30" y="50" width="60" height="14" rx="7" fill="rgba(16,20,30,.08)"/>';}else{const hs=[26,40,20,46,32];hs.forEach((h,i)=>b+='<rect x="'+(12+i*20)+'" y="'+(66-h)+'" width="12" height="'+h+'" rx="3" style="fill:var(--p-blue)" opacity="'+(.4+i*.14)+'"/>');}return b;}

  let hero=0;

    $("h-name").textContent=t.name; $("h-tag").textContent=t.tag; $("h-desc").textContent=t.desc;

    deckOrder=Array.from({length:n},(_,i)=>i); deckN=n; deckLayout(); deckPlay();
    const open=$("lnk-open"); open.href=(t.url&&t.url!=='#')?t.url:'#';

  /* ---------- 牌堆式图廊:每张 16:9,纵向错位堆叠,层数跟随图片张数 ---------- */
  let deckOrder=[],deckN=1,deckTimer=null;
  function deckLayout(){const sv=$("stageview");const cards=sv.querySelectorAll(".render");
    const n=deckOrder.length, lv=Math.min(n-1,7);
    sv.style.aspectRatio=n<2?"16/9":"16/15";
    const step=n>1?66.66/lv:0;
    deckOrder.forEach((ci,pos)=>{const el=cards[ci]; if(!el)return;
      const k=Math.min(pos,lv);
      el.className="render"+(pos>lv?" dh":"");
      el.style.zIndex=30-pos*4;
      let tf="translateY("+(k*step).toFixed(2)+"%)", fl="none",
          op=pos>lv?"0":(k===0?"1":Math.max(.25,1-k*.15).toFixed(2)),
          sh=k===0
            ?"0 2px 6px rgba(16,20,30,.08), 0 18px 44px rgba(16,20,30,.20)"
            :"0 2px 4px rgba(16,20,30,"+Math.max(.03,.08-k*.01).toFixed(2)+")";
      if(k>0){

        fl="saturate("+Math.max(.8,1-k*.05).toFixed(2)+") blur("+Math.min(k*.25,1).toFixed(2)+"px)";
      }
      el.style.transform=tf;
      el.style.filter=fl;
      el.style.boxShadow=sh;
      el.style.opacity=op;
    });}

            rF=((k%2?1:-1)*Math.min(.5+k*.12,1.2)).toFixed(2),
            oF=k===0?"1":Math.max(.25,1-k*.15).toFixed(2);
      /* 归位动画:从槽位下方 60px 向上冒出淡入,衔接切牌 */
      top.classList.add("snap");
      top.style.opacity="0";
      top.style.transform="translateY(calc("+yF+"% + 60px))";
      void top.offsetWidth;
      top.classList.remove("snap");
      top.style.opacity=oF;
      top.style.transform="translateY("+yF+"%) rotate("+rF+"deg)";
    },480);}

  /* ---------- 埋点上报(有后端时自动启用) ---------- */
  const API_BASE=(window.API_BASE||'https://api.agarena.xyz').replace(/\/$/,'');

  let ANON=null; try{ANON=localStorage.getItem('shufy_anon');}catch(e){}
  if(!ANON){ANON='u-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); try{localStorage.setItem('shufy_anon',ANON);}catch(e){}}
  const SID=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
  const FP=[navigator.userAgent,screen.width,screen.height,navigator.language].join('|');
  /* 来源暗号：站外链接统一带 ?from=平台&v=内容编号，如 ?from=bilibili&v=lv01 */
  let SRC=null,SRCV=null; try{const _q=new URLSearchParams(location.search); SRC=(_q.get('from')||'').slice(0,40)||null; SRCV=(_q.get('v')||'').slice(0,40)||null;}catch(e){}
  const Q=[];
  function ctx(){return {path:location.pathname,referrer:document.referrer||null,language:navigator.language,timezone:(Intl.DateTimeFormat().resolvedOptions().timeZone||null),screen:{w:innerWidth,h:innerHeight},platform:navigator.platform,src:SRC,v:SRCV,landing:location.pathname+location.search,consent:true};}
  function track(type,targetType,targetId,extra){if(!API_ON)return; Q.push(Object.assign({type,targetType,targetId,path:location.pathname,ts:new Date().toISOString()},extra||{})); if(Q.length>=12)flush();}
  function flush(){if(!API_ON||!Q.length)return; const body={anonId:ANON,fingerprint:FP,sessionId:SID,context:ctx(),events:Q.splice(0)};
    try{const j=JSON.stringify(body); if(navigator.sendBeacon)navigator.sendBeacon(API_BASE+'/api/collect',new Blob([j],{type:'application/json'})); else fetch(API_BASE+'/api/collect',{method:'POST',headers:{'Content-Type':'application/json'},body:j,keepalive:true});}catch(e){}}
